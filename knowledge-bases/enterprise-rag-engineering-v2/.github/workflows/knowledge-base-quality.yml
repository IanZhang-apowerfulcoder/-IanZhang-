name: knowledge-base-quality
on:
  pull_request:
    paths:
      - "data/**"
      - "contracts/**"
      - "server/**"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/validate_pack.py
      - run: python scripts/run_retrieval_eval.py
      - run: pytest -q
