与责任分层：阶段责任隔离", "content": "知识点：RAG端到端流水线与责任分层\n主题：阶段责任隔离\n检索器负责找到尽可能相关的证据，生成器负责在证据范围内完成任务，审核器负责验证事实、引用、难度和格式。把三者混成一个不可观测调用，会导致问题发生后无法定位根因。\n适用边界：在线流程不得使用未发布知识版本；关键状态必须可回放；每个环节必须有失败和降级路径", "difficulty_level": 1, "source_ids": ["SRC-RAGAS-2023", "SRC-COMPETITION-XH-202630"], "citation_text": "RAG基础与方案选择 / RAG端到端流水线与责任分层 / 阶段责任隔离"}, {"chunk_id": "bf90160b-8b40-5349-8d12-f3df4d5a4521", "evidence_id": "0cbdabc0-1c7f-5315-b264-d7240cc87b5d", "title": "RAG端到端流水线与责任分层：可观测与回放", "content": "知识点：RAG端到端流水线与责任分层\n主题：可观测与回放\n每次运行应记录知识库版本、查询、过滤条件、命中片段、排名、模型和提示词版本、最终引用、审核结论及耗时。这样才能重放失败案例、比较版本并证明指标来自真实运行。\n适用边界：在线流程不得使用未发布知识版本；关键状态必须可回放；每个环节必须有失败和降级路径", "difficulty_level": 1, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "RAG基础与方案选择 / RAG端到端流水线与责任分层 / 可观测与回放"}]}, {"id": "RAG-M01-N03", "module_id": "RAG-M01", "name": "RAG、微调、长上下文与工具调用的选择", "aliases": ["RAG与微调", "RAG vs Fine-tuning", "长上下文方案选择"], "difficulty": 2, "core": true, "importance": 0.95, "estimated_minutes": 60, "prerequisites": ["RAG-M01-N01"], "objectives": ["根据知识变化、行为风格和工具执行需求选择方案", "理解多种方法可以组合而非互斥", "避免用微调承担高频事实更新"], "summary": "RAG适合外部知识注入和来源追溯，微调更适合稳定行为模式，长上下文适合一次性材料，工具调用适合执行可验证操作。架构选择应由问题特征而不是技术热度决定。", "facts": [{"heading": "RAG适用条件", "body": "当知识频繁更新、来源必须可追溯、不同租户拥有不同资料或需要权限过滤时，RAG通常优于把事实写入模型参数。知识版本可以独立发布和回滚。", "source_ids": ["SRC-RAG-LEWIS-2020"]}, {"heading": "微调的主要位置", "body": "监督微调或参数高效微调更适合稳定输出格式、领域表达习惯、分类判定和工具选择模式。它不能天然提供文档级引用，也不适合作为高频变化事实的唯一存储。", "source_ids": ["SRC-RAG-LEWIS-2020"]}, {"heading": "长上下文的限制", "body": "把整批资料直接放入上下文可以减少索引工程，但成本、延迟和噪声会随材料增长；研究也显示相关信息位于长上下文不同位置时，模型利用效果可能明显变化。", "source_ids": ["SRC-LOST-MIDDLE-2024"]}, {"heading": "工具调用的职责", "body": "当任务要求查询结构化数据库、执行代码、计算指标或调用业务系统时，应使用受权限控制的工具，而不是让模型根据文档猜测实时结果。RAG负责提供知识，工具负责执行可验证动作。", "source_ids": ["SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "微调以后就不需要知识库。", "correction": "行为适配和事实检索解决不同问题，常见生产方案会组合使用。"}, {"wrong": "上下文窗口足够大就可以永远不检索。", "correction": "长上下文仍有成本、权限、版本、噪声和信息位置敏感等问题。"}], "boundaries": ["方案选择必须记录业务前提", "实时数据优先使用工具查询", "高频更新事实不得只依赖微调记忆"], "task": {"title": "完成四种知识增强方式的架构选型", "description": "针对政策手册问答、代码风格生成、实时库存查询和一次性合同摘要四个场景分别选择RAG、微调、长上下文或工具调用，并说明组合方式。", "deliverable": "四场景决策矩阵", "rubric": ["每个场景给出明确主方案", "说明知识更新与可追溯性", "识别组合方案", "列出至少一项反例"]}, "_module_name": "RAG基础与方案选择", "_chunks": [{"chunk_id": "ef953a32-872c-596e-86d4-3bb0dfbcb644", "evidence_id": "f2b2fa8a-fee3-586e-bbc3-98b5ecb5f1af", "title": "RAG、微调、长上下文与工具调用的选择：RAG适用条件", "content": "知识点：RAG、微调、长上下文与工具调用的选择\n主题：RAG适用条件\n当知识频繁更新、来源必须可追溯、不同租户拥有不同资料或需要权限过滤时，RAG通常优于把事实写入模型参数。知识版本可以独立发布和回滚。\n适用边界：方案选择必须记录业务前提；实时数据优先使用工具查询；高频更新事实不得只依赖微调记忆", "difficulty_level": 2, "source_ids": ["SRC-RAG-LEWIS-2020"], "citation_text": "RAG基础与方案选择 / RAG、微调、长上下文与工具调用的选择 / RAG适用条件"}, {"chunk_id": "01eb77ce-08e4-5b32-9fa3-87a57c9daa74", "evidence_id": "3bbdce74-b29f-52ac-8394-06056f2e85f0", "title": "RAG、微调、长上下文与工具调用的选择：微调的主要位置", "content": "知识点：RAG、微调、长上下文与工具调用的选择\n主题：微调的主要位置\n监督微调或参数高效微调更适合稳定输出格式、领域表达习惯、分类判定和工具选择模式。它不能天然提供文档级引用，也不适合作为高频变化事实的唯一存储。\n适用边界：方案选择必须记录业务前提；实时数据优先使用工具查询；高频更新事实不得只依赖微调记忆", "difficulty_level": 2, "source_ids": ["SRC-RAG-LEWIS-2020"], "citation_text": "RAG基础与方案选择 / RAG、微调、长上下文与工具调用的选择 / 微调的主要位置"}, {"chunk_id": "823e104d-d7b2-540c-b330-6b362ebfd7a2", "evidence_id": "bdafa642-49da-5f6f-897b-a1302eae874a", "title": "RAG、微调、长上下文与工具调用的选择：长上下文的限制", "content": "知识点：RAG、微调、长上下文与工具调用的选择\n主题：长上下文的限制\n把整批资料直接放入上下文可以减少索引工程，但成本、延迟和噪声会随材料增长；研究也显示相关信息位于长上下文不同位置时，模型利用效果可能明显变化。\n适用边界：方案选择必须记录业务前提；实时数据优先使用工具查询；高频更新事实不得只依赖微调记忆", "difficulty_level": 2, "source_ids": ["SRC-LOST-MIDDLE-2024"], "citation_text": "RAG基础与方案选择 / RAG、微调、长上下文与工具调用的选择 / 长上下文的限制"}, {"chunk_id": "cd8e2dd5-9256-55aa-8650-50be6ff65757", "evidence_id": "135c2547-e958-5725-b386-ba992f9a2714", "title": "RAG、微调、长上下文与工具调用的选择：工具调用的职责", "content": "知识点：RAG、微调、长上下文与工具调用的选择\n主题：工具调用的职责\n当任务要求查询结构化数据库、执行代码、计算指标或调用业务系统时，应使用受权限控制的工具，而不是让模型根据文档猜测实时结果。RAG负责提供知识，工具负责执行可验证动作。\n适用边界：方案选择必须记录业务前提；实时数据优先使用工具查询；高频更新事实不得只依赖微调记忆", "difficulty_level": 2, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "RAG基础与方案选择 / RAG、微调、长上下文与工具调用的选择 / 工具调用的职责"}]}, {"id": "RAG-M01-N04", "module_id": "RAG-M01", "name": "需求分析、成功指标与RAG架构决策", "aliases": ["RAG需求分析", "RAG技术选型", "成功标准"], "difficulty": 2, "core": true, "importance": 0.95, "estimated_minutes": 75, "prerequisites": ["RAG-M01-N02", "RAG-M01-N03"], "objectives": ["把模糊需求转化为可评测问题集", "定义准确性、时延、成本、安全和可维护性指标", "根据知识形态选择检索与索引策略"], "summary": "RAG项目应从用户任务、答案证据和失败代价出发。没有固定评测集和门禁，系统无法证明改动有效，也无法决定何时使用普通混合检索、层级检索、图检索或结构化查询。", "facts": [{"heading": "先定义用户任务", "body": "需求文档需要说明谁在什么情境下提出什么问题、可接受哪些来源、哪些答案必须拒答、错误会造成什么后果。仅写“做一个智能知识库”无法指导切片、权限和评测。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "建立黄金问题集", "body": "在开发索引前先收集代表性问题、期望证据、可接受答案要点和拒答样例。黄金集应覆盖事实、比较、步骤、故障排查、多跳关系和越权请求，后续所有版本都运行回归。", "source_ids": ["SRC-RAGAS-2023", "SRC-NIST-AI-RMF"]}, {"heading": "指标分层", "body": "检索层关注Hit Rate、Recall、MRR、nDCG和上下文精度；生成层关注事实忠实度、引用正确率、完整性和拒答正确率；系统层关注P95时延、成本、失败率、恢复能力与用户任务完成率。", "source_ids": ["SRC-RAGAS-2023"]}, {"heading": "知识形态驱动架构", "body": "独立短事实适合混合检索；长层级文档适合父子检索；实体关系和多跳问题适合图检索；规则表和实时指标适合结构化查询；代码问题需要符号和调用关系索引。", "source_ids": ["SRC-GRAPHRAG-OFFICIAL", "SRC-LLAMAINDEX-HIERARCHY"]}], "misconceptions": [{"wrong": "先把系统做出来，再找一些问题测试。", "correction": "评测集应在核心实现前冻结，否则容易只测试系统擅长的问题。"}, {"wrong": "一个准确率就能代表RAG质量。", "correction": "检索、生成、系统和业务价值必须分层度量。"}], "boundaries": ["每项指标必须给出计算口径", "评测集需版本化并防止泄漏", "架构选择必须能回溯到知识形态和问题类型"], "task": {"title": "编写RAG项目的可验收需求规格", "description": "选择一个培训场景，定义用户任务、知识范围、50条问题集构成、四层指标和发布门禁。", "deliverable": "需求与评测蓝图", "rubric": ["问题类型覆盖完整", "指标有明确分母分子", "包含拒答与安全案例", "架构决策与知识形态一致"]}, "_module_name": "RAG基础与方案选择", "_chunks": [{"chunk_id": "5a6683ce-10d9-57cd-a6ce-61ad22e80d04", "evidence_id": "3ed623c7-fb38-5e39-bc64-befbff600e5a", "title": "需求分析、成功指标与RAG架构决策：先定义用户任务", "content": "知识点：需求分析、成功指标与RAG架构决策\n主题：先定义用户任务\n需求文档需要说明谁在什么情境下提出什么问题、可接受哪些来源、哪些答案必须拒答、错误会造成什么后果。仅写“做一个智能知识库”无法指导切片、权限和评测。\n适用边界：每项指标必须给出计算口径；评测集需版本化并防止泄漏；架构选择必须能回溯到知识形态和问题类型", "difficulty_level": 2, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "RAG基础与方案选择 / 需求分析、成 自动发布；过期来源必须支持撤回与影响分析", "difficulty_level": 1, "source_ids": ["SRC-NIST-AI-RMF", "SRC-COMPETITION-XH-202630"], "citation_text": "数据治理与知识构建 / 知识源治理、可信等级与准入 / 派生内容可追溯"}, {"chunk_id": "268d814f-650b-5285-8b74-5140505cd684", "evidence_id": "19a5d2af-6eb3-5673-b2cb-087fac1fa0be", "title": "知识源治理、可信等级与准入：冲突与失效", "content": "知识点：知识源治理、可信等级与准入\n主题：冲突与失效\n当不同来源结论冲突时，系统不能简单平均或任选一个。应按权威性、适用时间、适用对象和版本生效范围做裁决；无法确定时标记冲突并转人工审核。\n适用边界：未授权敏感资料不得入库；模型生成草稿不得自动发布；过期来源必须支持撤回与影响分析", "difficulty_level": 1, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "数据治理与知识构建 / 知识源治理、可信等级与准入 / 冲突与失效"}]}, {"id": "RAG-M02-N02", "module_id": "RAG-M02", "name": "文档解析、清洗与结构保真", "aliases": ["document parsing", "文档清洗", "版面解析"], "difficulty": 2, "core": true, "importance": 0.95, "estimated_minutes": 75, "prerequisites": ["RAG-M02-N01"], "objectives": ["区分文本提取、OCR和版面结构解析", "处理页眉页脚、断行、表格、代码和扫描件", "建立解析质量门禁"], "summary": "解析阶段必须尽可能保留标题层级、列表、表格、代码块和页码等结构。错误解析会污染后续所有切片和检索，不能靠更强模型自动弥补。", "facts": [{"heading": "按文件类型选择解析器", "body": "Markdown、HTML、DOCX、原生PDF、扫描PDF、表格和代码仓库需要不同解析策略。优先使用原生文本和结构信息；只有没有可靠文本层时才使用OCR，并保留OCR置信度。", "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"]}, {"heading": "结构保真", "body": "解析结果应保留章节路径、页码、表格行列、代码语言、列表层级、图片说明和前后节点关系。结构字段既用于切片，也用于引用定位和父子检索。", "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"]}, {"heading": "清洗原则", "body": "删除重复页眉页脚、导航噪声和空白，但不能把否定词、单位、表格标题或代码缩进误删。清洗步骤必须可重放，并保存原始文本、清洗文本和差异摘要。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "解析验收", "body": "抽样检查字符完整率、标题识别率、表格保真率、代码块完整率和页码定位。关键资料应设置人工抽检比例；低于阈值时阻止进入切片和索引阶段。", "source_ids": ["SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "所有PDF都可以直接提取文本。", "correction": "扫描PDF可能没有文本层，复杂版面也可能发生阅读顺序错误。"}, {"wrong": "解析只要看起来有文字就算成功。", "correction": "标题、表格、代码和页码错位会直接破坏知识单元与引用。"}], "boundaries": ["保留原始文件和解析版本", "关键资料解析失败必须阻断发布", "OCR结果需标记置信度与人工复核状态"], "task": {"title": "设计多格式文档解析验收方案", "description": "为PDF、扫描件、DOCX、Markdown、表格和代码六类资料制定解析管线、抽检项目和失败门禁。", "deliverable": "解析策略矩阵与10个测试样例", "rubric": ["文件类型策略不同", "结构字段完整", "有可量化门禁", "包含回滚和重解析"]}, "_module_name": "数据治理与知识构建", "_chunks": [{"chunk_id": "7b42eb32-7cc8-5870-a703-2b64cc6e937e", "evidence_id": "507145bd-82bf-57de-ba2c-02e7c516d149", "title": "文档解析、清洗与结构保真：按文件类型选择解析器", "content": "知识点：文档解析、清洗与结构保真\n主题：按文件类型选择解析器\nMarkdown、HTML、DOCX、原生PDF、扫描PDF、表格和代码仓库需要不同解析策略。优先使用原生文本和结构信息；只有没有可靠文本层时才使用OCR，并保留OCR置信度。\n适用边界：保留原始文件和解析版本；关键资料解析失败必须阻断发布；OCR结果需标记置信度与人工复核状态", "difficulty_level": 2, "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"], "citation_text": "数据治理与知识构建 / 文档解析、清洗与结构保真 / 按文件类型选择解析器"}, {"chunk_id": "f378f42a-c50c-5f24-a63e-99106ce2a6ff", "evidence_id": "459f4320-ffba-555d-9b05-e679be68ff95", "title": "文档解析、清洗与结构保真：结构保真", "content": "知识点：文档解析、清洗与结构保真\n主题：结构保真\n解析结果应保留章节路径、页码、表格行列、代码语言、列表层级、图片说明和前后节点关系。结构字段既用于切片，也用于引用定位和父子检索。\n适用边界：保留原始文件和解析版本；关键资料解析失败必须阻断发布；OCR结果需标记置信度与人工复核状态", "difficulty_level": 2, "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"], "citation_text": "数据治理与知识构建 / 文档解析、清洗与结构保真 / 结构保真"}, {"chunk_id": "5f92f712-f6f3-516b-b8ea-08d0d4f1b6f1", "evidence_id": "44da0ddb-5f54-55a7-a6d2-dd3665dbd829", "title": "文档解析、清洗与结构保真：清洗原则", "content": "知识点：文档解析、清洗与结构保真\n主题：清洗原则\n删除重复页眉页脚、导航噪声和空白，但不能把否定词、单位、表格标题或代码缩进误删。清洗步骤必须可重放，并保存原始文本、清洗文本和差异摘要。\n适用边界：保留原始文件和解析版本；关键资料解析失败必须阻断发布；OCR结果需标记置信度与人工复核状态", "difficulty_level": 2, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "数据治理与知识构建 / 文档解析、清洗与结构保真 / 清洗原则"}, {"chunk_id": "35ed6e33-5e4a-53ad-b2a3-5465ec73bddd", "evidence_id": "d3ec5725-8e5f-57b6-aec7-c0f45172e0bb", "title": "文档解析、清洗与结构保真：解析验收", "content": "知识点：文档解析、清洗与结构保真\n主题：解析验收\n抽样检查字符完整率、标题识别率、表格保真率、代码块完整率和页码定位。关键资料应设置人工抽检比例；低于阈值时阻止进入切片和索引阶段。\n适用边界：保留原始文件和解析版本；关键资料解析失败必须阻断发布；OCR结果需标记置信度与人工复核状态", "difficulty_level": 2, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "数据治理与知识构建 / 文档解析、清洗与结构保真 / 解析验收"}]}, {"id": "RAG-M02-N03", "module_id": "RAG-M02", "name": "切片策略、语义边界与父子结构", "aliases": ["chunking", "文档切片", "parent-child chunks"], "difficulty": 2, "core": true, "importance": 1.0, "estimated_minutes": 90, "prerequisites": ["RAG-M02-N02"], "objectives": ["根据内容类型选择固定、递归、语义、层级或代码切片", "理解chunk size与overlap的召回和噪声权衡", "设计父子节点与前后关系"], "summary": "切片不是简单按固定字符截断，而是把资料转化为可独立检索、又保留必要上下文的证据单元。最佳策略需要用真实问题集评测，不能只凭经验设置长度。", "facts": [{"heading": "语义完整性优先", "body": "一个切片应尽量围绕单一可回答主题，保留定义、条件、例外和结论。跨标题、把否定条件拆开或把表头与数据分离，都会产生表面相关但不可用的证据。", "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"]}, {"heading": "长度与重叠权衡", "body": "切片过小会丢失上下文并增加碎片；过大会混入多个主题并降低上下文精度。重叠可减少边界损失，但会增加索引体积和重复结果。参数必须通过Hit Rate、MRR和上下文精度比较。", "source_ids": ["SRC-RAGAS-2023"]}, {"heading": "父子层级", "body": "长文档可同时保存较小的叶子节点和较大的父节点。检索用叶子节点提高定位精度，返回上下文时再补充父节点，从而兼顾召回和完整性。", "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"]}, {"heading": "按内容类型切片", "body": "表格应按逻辑行组和表头切片，代码按符号和调用关系切片，FAQ按完整问答切片，规章制度按条款与适用范围切片。一个全局固定长度策略通常不足。", "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"]}], "misconceptions": [{"wrong": "chunk size越大，模型得到的信息越多，所以越好。", "correction": "过大切片会降低定位精度、增加噪声和上下文成本。"}, {"wrong": "overlap越大越保险。", "correction": "过度重叠会造成重复召回、引用冗余和索引成本上升。"}], "boundaries": ["切片必须保留来源位置", "参数变更要创建新索引版本", "不得把表头、否定条件与正文分离"], "task": {"title": "完成三种切片策略消融实验", "description": "对同一份长技术文档实施固定长度、递归标题和父子切片，使用20条问题比较Hit@5、MRR、上下文精度和索引规模。", "deliverable": "切片数据、评测脚本和决策报告", "rubric": ["至少三种策略", "问题集含事实和步骤题", "指标可复现", "结论基于数据而非直觉"]}, "_module_name": "数据治理与知识构建", "_chunks": [{"chunk_id": "47998d15-d7af-59ba-8dd6-095131da932e", "evidence_id": "afb69292-46aa-55c7-b4b5-5b895d9d4513", "title": "切片策略、语义边界与父子结构：语义完整性优先", "content": "知识点：切片策略、语义边界与父子结构\n主题：语义完整性优先\n一个切片应尽量围绕单一可回答主题，保留定义、条件、例外和结论。跨标题、把否定条件拆开或把表头与数据分离，都会产生表面相关但不可用的证据。\n适用边界：切片必须保留来源位置；参数变更要创建新索引版本；不得把表头、否定条件与正文分离", "difficulty_level": 2, "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"], "citation_text": "数据治理与知识构建 / 切片策略、语义边界与父子结构 / 语义完整性优先"}, {"chunk_id": "83f9c8b4-7573-53a1-bd3e-f44ca43ec392", "evidence_id": "42e17c0b-2db3-52ac-b398-eca5dc702b4f", "title": "切片策略、语义边界与父子结构：长度与重叠权衡", "content": "知识点：切片策略、语义边界与父子结构\n主题：长度与重叠权衡\n切片过小会丢失上下文并增加碎片；过大会混入多个主题并降低上下文精度。重叠可减少边界损失，但会增加索引体积和重复结果。参数必须通过Hit Rate、MRR和上下文精度比较。\n适用边界：切片必须保留来源位置；参数变更要创建新索引版本；不得把表头、否定条件与正文分离", "difficulty_level": 2, "source_ids": ["SRC-RAGAS-2023"], "citation_text": "数据治理与知识构建 / 切片策略、语义边界与父子结构 / 长度与重叠权衡"}, {"chunk_id": "a65781f0-ab25-562c-989d-330d499eb70d", "evidence_id": "f4b2772e-9f5f-5419-9b2b-cd8a22ef39de", "title": "切片策略、语义边界与父子结构：父子层级", "content": "知识点：切片策略、语义边界与父子结构\n主题：父子层级\n长文档可同时保存较小的叶子节点和较大的父节点。检索用叶子节点提高定位精度，返回上下文时再补充父节点，从而兼顾召回和完整性。\n适用边界：切片必须保留来源位置；参数变更要创建新索引版本；不得把表头、否定条件与正文分离", "difficulty_level": 2, "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"], "citation_text": "数据治理与知识构建 / 切片策略、语义边界与父子结构 / 父子层级"}, {"chunk_id": "0673987c-1fdd-521d-943f-5c93f1853410", "evidence_id": "8ccfef39-f6ff-5035-a27f-e0413f934758", "title": "切片策略、语义边界与父子结构：按内容类型切片", "content": "知识点：切片策略、语义边界与父子结构\n主题：按内容类型切片\n表格应按逻辑行组和表头切片，代码按符号和调用关系切片，FAQ按完整问答切片，规章制度按条款与适用范围切片。一个全局固定长度策略通常不足。\n适用边界：切片必须保留来源位置；参数变更要创建新索引版本；不得把表头、否定条件与正文分离", "difficulty_level": 2, "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"], "citation_text": "数据治理与知识构建 / 切片策略、语义边界与父子结构 / 按内容类型切片"}]}, {"id": "RAG-M02-N04", "module_id": "RAG-M02", "name": "元数据、版本、血缘与知识发布", "aliases": ["metadata", "knowledge versioning", "provenance"], "difficulty": 3, "core": true, "importance": 1.0, "estimated_minutes": 75, "prerequisites": ["RAG-M02-N01", "RAG-M02-N03"], "objectives": ["设计检索、权限、引用和回滚所需元数据", "实现不可变知识版本和激活指针", "追踪原始资料到最终证据的血缘"], "summary": "元数据是知识库治理与检索控制面。一个可发布的知识版本应固定文档、切片、索引、嵌入模型、图结构、评测结果和审批记录，不能在运行中悄然变化。", "facts": [{"heading": "最小元数据集", "body": "切片至少包含chunk_id、document_id、knowledge_node_id、标题路径、页码或锚点、版本、语言、难度、来源等级、有效期、权限标签、内容哈希和父子关系。", "source_ids": ["SRC-NIST-AI-RMF", "SRC-LLAMAINDEX-HIERARCHY"]}, {"heading": "不可变版本", "body": "知识库版本发布后保持不可变。新增、删除、重新切片或更换嵌入模型都创建候选新版本；通过评测和审批后再切换激活指针，旧版本保留用于回放与回滚。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "血缘链", "body": "最终答案中的evidence_id应能追溯到chunk_id、document_id、原始文件、解析版本和来源登记记录。题目、讲义与关系边也要保存其依据，避免形成无法解释的二手知识。", "source_ids": ["SRC-COMPETITION-XH-202630", "SRC-NIST-AI-RMF"]}, {"heading": "发布门禁", "body": "候选版本需通过Schema、ID唯一性、引用完整性、来源准入、检索回归、核心节点覆盖、冲突检查和安全测试。任何阻断项失败都不能标记为published。", "source_ids": ["SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "metadata只是方便展示，可以后补。", "correction": "权限过滤、版本回放、引用和评测都依赖元数据，必须在接入时建立。"}, {"wrong": "修改数据库里的旧切片比新建版本简单。", "correction": "原地修改会破坏历史运行可复现性和审计链。"}], "boundaries": ["发布版本不可原地修改", "所有引用必须可追溯", "权限标签必须在检索前过滤而非生成后遮盖"], "task": {"title": "设计Domain Pack发布与回滚流程", "description": "定义候选、质量失败、就绪、发布和退役状态，列出版本对象、门禁、审批人和一键回滚步骤。", "deliverable": "状态机、元数据Schema与迁移脚本", "rubric": ["状态迁移无歧义", "覆盖索引与模型版本", "引用血缘完整", "回滚不丢失历史运行"]}, "_module_name": "数据治理与知识构建", "_chunks": [{"chunk_id": "25dc0669-e0d9-5ec9-9d79-5c164dc5bd37", "evidence_id": "110a39ee-0b6b-56b0-9c4f-626fbb785b1a", "title": "元数据、版本、血缘与知识发布：最小元数据集", "content": "知识点：元数据、版本、血缘与知识发布\n主题：最小元数据集\n切片至少包含chunk_id、document_id、knowledge_node_id、标题路径、页码或锚点、版本、语言、难度、来源等级、有效期、权限标签、内容哈希和父子关系。\n适用边界：发布版本不可原地修改；所有引用必须可追溯；权限标签必须在检索前过滤而非生成后遮盖", "difficulty_level": 3, "source_ids": ["SRC-NIST-AI-RMF", "SRC-LLAMAINDEX-HIERARCHY"], "citation_text": "数据治理与知识构建 / 元数据、版本、血缘与知识发布 / 最小元数据集"}, {"chunk_id": "777c78ed-9975-58ad-b316-58e5040dfc84", "evidence_id": "de2d06e7-6962-5ce2-b3f9-b8d983be22b8", "title": "元数据、版本、血缘与知识发布：不可变版本", "content": "知识点：元数据、版本、血缘与知识发布\n主题：不可变版本\n知识库版本发布后保持不可变。新增、删除、重新切片或更换嵌入模型都创建候选新版本；通过评测和审批后再切换激活指针，旧版本保留用于回放与回滚。\n适用边界：发布版本不可原地修改；所有引用必须可追溯；权限标签必须在检索前过滤而非生成后遮盖", "difficulty_level": 3, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "数据治理与知识构建 / 元数据、版本、血缘与知识发布 / 不可变版本"}, {"chunk_id": "e1243373-ebca-53aa-86ef-6ee693452560", "evidence_id": "8682abe8-16eb-58ff-8869-c1fa1c56290c", "title": "元数据、版本、血缘与知识发布：血缘链", "content": "知识点：元数据、版本、血缘与知识发布\n主题：血缘链\n最终答案中的evidence_id应能追溯到chunk_id、document_id、原始文件、解析版本和来源登记记录。题目、讲义与关系边也要保存其依据，避免形成无法解释的二手知识。\n适用边界：发布版本不可原地修改；所有引用必须可追溯；权限标签必须在检索前过滤而非生成后遮盖", "difficulty_level": 3, "source_ids": ["SRC-COMPETITION-XH-202630", "SRC-NIST-AI-RMF"], "citation_text": "数据治理与知识构建 / 元数据、版本、血缘与知识发布 / 血缘链"}, {"chunk_id": "299662c4-5084-55d3-9617-b1085ac71ad5", "evidence_id": "4cb0290e-cbda-526c-b420-5e1044866f55", "title": "元数据、版本、血缘与知识发布：发布门禁", "content": "知识点：元数据、版本、血缘与知识发布\n主题：发布门禁\n候选版本需通过Schema、ID唯一性、引用完整性、来源准入、检索回归、核心节点覆盖、冲突检查和安全测试。任何阻断项失败都不能标记为published。\n适用边界：发布版本不可原地修改；所有引用必须可追溯；权限标签必须在检索前过滤而非生成后遮盖", "difficulty_level": 3, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "数据治理与知识构建 / 元数据、版本、血缘与知识发布 / 发布门禁"}]}, {"id": "RAG-M03-N01", "module_id": "RAG-M03", "name": "文本嵌入、向量表示与相似度", "aliases": ["embedding", "sentence embedding", "语义向量"], "difficulty": 2, "core": true, "importance": 1.0, "estimated_minutes": 75, "prerequisites": ["RAG-M02-N03"], "objectives": ["解释嵌入向量用于表示语义相似性的基本机制", "区分余弦相似度、内积和欧氏距离", "设计嵌入模型选型与离线评测"], "summary": "文本嵌入把查询和知识片段映射到向量空间，使语义相近内容可以通过距离或相似度检索。模型语言、领域、维度和归一化方式必须与索引及评测保持一致。", "facts": [{"heading": "语义表示", "body": "句向量模型把可变长度文本编码为固定维度向量，目标是让语义相关文本在向量空间中更接近。它适合召回同义表达，但不保证精确匹配编号、公式或专有缩写。", "source_ids": ["SRC-SBERT-2019"]}, {"heading": "距离函数一致性", "body": "余弦距离关注方向，内积同时受方向和向量长度影响，欧氏距离衡量几何距离。索引创建、查询和模型是否归一化必须一致，否则排序含义会发生变化。", "source_ids": ["SRC-PGVECTOR-OFFICIAL"]}, {"heading": "模型选型", "body": "选型需要比较目标语言、领域术语、上下文长度、维度、吞吐、许可和部署方式。不能只根据公开榜单决定，应使用本项目固定问题集测量召回、排序和成本。", "source_ids": ["SRC-SBERT-2019", "SRC-NIST-AI-RMF"]}, {"heading": "嵌入版本化", "body": "更换嵌入模型、维度、前处理或归一化方式会改变全部向量，应创建新索引版本并重新跑回归。查询向量与文档向量不得来自不兼容版本。", "source_ids": ["SRC-PGVECTOR-OFFICIAL", "SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "语义相关就一定事实相关。", "correction": "嵌入召回的是相似表达，仍可能缺少适用条件、版本或具体事实。"}, {"wrong": "所有模型输出都可以使用同一种距离函数。", "correction": "必须按模型训练方式、归一化和索引配置确定距离函数。"}], "boundaries": ["嵌入模型和预处理必须记录版本", "专有编号和精确术语需结合关键词检索", "模型更换必须重建索引"], "task": {"title": "完成三种嵌入方案的领域检索评测", "description": "使用同一组查询比较三种候选嵌入或配置，报告Recall@5、MRR、延迟、向量大小和错误类型。", "deliverable": "可复现实验与选型ADR", "rubric": ["使用固定测试集", "距离函数配置正确", "包含错误分析", "说明迁移成本"]}, "_module_name": "表示、索引与基础检索", "_chunks": [{"chunk_id": "b6709bfd-8cfa-5737-b783-177361986417", "evidence_id": "d2603583-8af0-5455-9b44-3d5e989c94c1", "title": "文本嵌入、向量表示与相似度：语义表示", "content": "知识点：文本嵌入、向量表示与相似度\n主题：语义表示\n句向量模型把可变长度文本编码为固定维度向量，目标是让语义相关文本在向量空间中更接近。它适合召回同义表达，但不保证精确匹配编号、公式或专有缩写。\n适用边界：嵌入模型和预处理必须记录版本；专有编号和精确术语需结合关键词检索；模型更换必须重建索引", "difficulty_level": 2, "source_ids": ["SRC-SBERT-2019"], "citation_text": "表示、索引与基础检索 / 文本嵌入、向量表示与相似度 / 语义表示"}, {"chunk_id": "2dbf7492-93dd-5c43-a233-184a7af3bae7", "evidence_id": "32df7ce1-8afb-5cfb-9b25-91de8fed3532", "title": "文本嵌入、向量表示与相似度：距离函数一致性", "content": "知识点：文本嵌入、向量表示与相似度\n主题：距离函数一致性\n余弦距离关注方向，内积同时受方向和向量长度影响，欧氏距离衡量几何距离。索引创建、查询和模型是否归一化必须一致，否则排序含义会发生变化。\n适用边界：嵌入模型和预处理必须记录版本；专有编号和精确术语需结合关键词检索；模型更换必须重建索引", "difficulty_level": 2, "source_ids": ["SRC-PGVECTOR-OFFICIAL"], "citation_text": "表示、索引与基础检索 / 文本嵌入、向量表示与相似度 / 距离函数一致性"}, {"chunk_id": "19824ae8-89db-59a0-a5d0-12bf8a90bfa6", "evidence_id": "9b9b3e6f-796b-5b9e-b2ac-7dd455c1f2f0", "title": "文本嵌入、向量表示与相似度：模型选型", "content": "知识点：文本嵌入、向量表示与相似度\n主题：模型选型\n选型需要比较目标语言、领域术语、上下文长度、维度、吞吐、许可和部署方式。不能只根据公开榜单决定，应使用本项目固定问题集测量召回、排序和成本。\n适用边界：嵌入模型和预处理必须记录版本；专有编号和精确术语需结合关键词检索；模型更换必须重建索引", "difficulty_level": 2, "source_ids": ["SRC-SBERT-2019", "SRC-NIST-AI-RMF"], "citation_text": "表示、索引与基础检索 / 文本嵌入、向量表示与相似度 / 模型选型"}, {"chunk_id": "284eaf68-a6db-5402-982e-1eb2f02cbf5b", "evidence_id": "2e9c8abd-4f76-5113-9886-e0d3edd77542", "title": "文本嵌入、向量表示与相似度：嵌入版本化", "content": "知识点：文本嵌入、向量表示与相似度\n主题：嵌入版本化\n更换嵌入模型、维度、前处理或归一化方式会改变全部向量，应创建新索引版本并重新跑回归。查询向量与文档向量不得来自不兼容版本。\n适用边界：嵌入模型和预处理必须记录版本；专有编号和精确术语需结合关键词检索；模型更换必须重建索引", "difficulty_level": 2, "source_ids": ["SRC-PGVECTOR-OFFICIAL", "SRC-NIST-AI-RMF"], "citation_text": "表示、索引与基础检索 / 文本嵌入、向量表示与相似度 / 嵌入版本化"}]}, {"id": "RAG-M03-N02", "module_id": "RAG-M03", "name": "向量存储、精确搜索、HNSW与IVFFlat", "aliases": ["vector database", "pgvector", "HNSW", "IVFFlat"], "difficulty": 3, "core": true, "importance": 0.95, "estimated_minutes": 90, "prerequisites": ["RAG-M03-N01", "RAG-M02-N04"], "objectives": ["在PostgreSQL/pgvector中存储和查询向量", "理解精确检索与近似检索的权衡", "根据数据量、更新频率和过滤条件选择索引"], "summary": "向量存储负责保存嵌入和执行最近邻搜索。精确搜索提供基准召回；HNSW通常有较好的速度-召回权衡但构建和内存成本较高；IVFFlat构建更轻但需要训练和调参。", "facts": [{"heading": "精确与近似检索", "body": "pgvector默认可执行精确最近邻搜索，适合小规模数据和评测基线。近似索引通过减少搜索范围提高速度，但可能牺牲召回，因此应定期与精确结果比较。", "source_ids": ["SRC-PGVECTOR-OFFICIAL"]}, {"heading": "HNSW", "body": "HNSW使用多层图结构，通常查询性能和速度-召回权衡较好，但索引构建更慢且占用更多内存。ef_search提高时召回通常提升，同时查询成本增加。", "source_ids": ["SRC-PGVECTOR-OFFICIAL"]}, {"heading": "IVFFlat", "body": "IVFFlat把向量分入多个列表，查询时只探测部分列表。它构建更快、内存较低，但需要数据后才能合理训练，lists和probes设置直接影响速度与召回。", "source_ids": ["SRC-PGVECTOR-OFFICIAL"]}, {"heading": "过滤与索引", "body": "权限、租户、版本和知识节点过滤应在检索计划中明确。近似索引可能先召回后过滤，导致返回数量不足；可以配合普通列索引、分区、部分索引或迭代扫描。", "source_ids": ["SRC-PGVECTOR-OFFICIAL"]}], "misconceptions": [{"wrong": "上了HNSW以后结果和精确搜索完全相同。", "correction": "HNSW属于近似搜索，需要用精确基线监测召回损失。"}, {"wrong": "IVFFlat创建后不需要调参。", "correction": "lists、probes、数据规模和数据分布都会影响质量与延迟。"}], "boundaries": ["上线前必须有精确检索基线", "租户和权限过滤不可省略", "索引参数变更必须进入版本记录"], "task": {"title": "为10万条知识切片设计pgvector索引方案", "description": "比较精确、HNSW和IVFFlat方案，设计过滤索引、参数试验和召回监控。", "deliverable": "SQL、基准脚本和容量报告", "rubric": ["包含精确基线", "测量P50/P95与Recall@10", "说明过滤行为", "提供回退方案"]}, "_module_name": "表示、索引与基础检索", "_chunks": [{"chunk_id": "b7f8d0e5-6fee-537c-b2f7-8770765af8c3", "evidence_id": "0db4adce-4113-5ed8-844f-89563f132422", "title": "向量存储、精确搜索、HNSW与IVFFlat：精确与近似检索", "content": "知识点：向量存储、精确搜索、HNSW与IVFFlat\n主题：精确与近似检索\npgvector默认可执行精确最近邻搜索，适合小规模数据和评测基线。近似索引通过减少搜索范围提高速度，但可能牺牲召回，因此应定期与精确结果比较。\n适用边界：上线前必须有精确检索基线；租户和权限过滤不可省略；索引参数变更必须进入版本记录", "difficulty_level": 3, "source_ids": ["SRC-PGVECTOR-OFFICIAL"], "citation_text": "表示、索引与基础检索 / 向量存储、精确搜索、HNSW与IVFFlat / 精确与近似检索"}, {"chunk_id": "c6b2a608-855d-53db-b789-f50ffb9132d4", "evidence_id": "5e8ced64-0f8f-5a42-906f-fa6ec450dc0f", "title": "向量存储、精确搜索、HNSW与IVFFlat：HNSW", "content": "知识点：向量存储、精确搜索、HNSW与IVFFlat\n主题：HNSW\nHNSW使用多层图结构，通常查询性能和速度-召回权衡较好，但索引构建更慢且占用更多内存。ef_search提高时召回通常提升，同时查询成本增加。\n适用边界：上线前必须有精确检索基线；租户和权限过滤不可省略；索引参数变更必须进入版本记录", "difficulty_level": 3, "source_ids": ["SRC-PGVECTOR-OFFICIAL"], "citation_text": "表示、索引与基础检索 / 向量存储、精确搜索、HNSW与IVFFlat / HNSW"}, {"chunk_id": "ca8031a6-1151-52fc-aff6-172e625f33bc", "evidence_id": "383e3b96-5fe2-5637-975e-836e1a294892", "title": "向量存储、精确搜索、HNSW与IVFFlat：IVFFlat", "content": "知识点：向量存储、精确搜索、HNSW与IVFFlat\n主题：IVFFlat\nIVFFlat把向量分入多个列表，查询时只探测部分列表。它构建更快、内存较低，但需要数据后才能合理训练，lists和probes设置直接影响速度与召回。\n适用边界：上线前必须有精确检索基线；租户和权限过滤不可省略；索引参数变更必须进入版本记录", "difficulty_level": 3, "source_ids": ["SRC-PGVECTOR-OFFICIAL"], "citation_text": "表示、索引与基础检索 / 向量存储、精确搜索、HNSW与IVFFlat / IVFFlat"}, {"chunk_id": "0c9a0fc0-ba92-5ac3-86ac-08850f2d10c8", "evidence_id": "881618b9-0202-5397-b16b-fb002bf8a858", "title": "向量存储、精确搜索、HNSW与IVFFlat：过滤与索引", "content": "知识点：向量存储、精确搜索、HNSW与IVFFlat\n主题：过滤与索引\n权限、租户、版本和知识节点过滤应在检索计划中明确。近似索引可能先召回后过滤，导致返回数量不足；可以配合普通列索引、分区、部分索引或迭代扫描。\n适用边界：上线前必须有精确检索基线；租户和权限过滤不可省略；索引参数变更必须进入版本记录", "difficulty_level": 3, "source_ids": ["SRC-PGVECTOR-OFFICIAL"], "citation_text": "表示、索引与基础检索 / 向量存储、精确搜索、HNSW与IVFFlat / 过滤与索引"}]}, {"id": "RAG-M03-N03", "module_id": "RAG-M03", "name": "BM25、关键词检索与精确术语召回", "aliases": ["BM25", "sparse retrieval", "全文检索", "关键词检索"], "difficulty": 2, "core": true, "importance": 0.95, "estimated_minutes": 60, "prerequisites": ["RAG-M02-N03"], "objectives": ["解释稀疏检索对精确词项的价值", "识别分词、停用词和领域词典对中文检索的影响", "设计关键词检索基线"], "summary": "关键词检索根据词项出现和区分度排序，擅长编号、产品名、错误码、函数名和罕见术语。它与向量检索互补，是混合检索不可缺少的基线。", "facts": [{"heading": "BM25直觉", "body": "BM25综合词项频率、文档频率和文档长度，对在少量文档中出现的查询词给予较高区分度，并通过饱和机制避免词频无限放大。", "source_ids": ["SRC-OPENSEARCH-HYBRID"]}, {"heading": "精确术语优势", "body": "版本号、错误码、API路径、类名和规范条款常被语义嵌入弱化，而关键词检索能直接利用字符或词项匹配。领域系统应为这些字段建立别名和规范化规则。", "source_ids": ["SRC-OPENSEARCH-HYBRID"]}, {"heading": "中文分词与词典", "body": "中文没有天然空格边界，分词器和领域词典会显著影响召回。可结合字符n-gram、专有词典、大小写与全半角归一化，避免把关键术语拆错。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "基线价值", "body": "即使最终使用稠密检索，也应保留关键词基线。它实现简单、可解释，能帮助定位嵌入模型是否真正改善了语义召回，还是只增加了复杂度。", "source_ids": ["SRC-RAGAS-2023"]}], "misconceptions": [{"wrong": "向量检索出现后关键词检索已经过时。", "correction": "二者擅长的查询类型不同，生产系统常用混合检索。"}, {"wrong": "关键词检索不需要数据治理。", "correction": "分词、同义词、别名、字段权重和版本过滤都会影响结果。"}], "boundaries": ["保留原始查询与规范化查询", "领域词典需要版本化", "关键词权重需通过评测调整"], "task": {"title": "构建领域BM25基线", "descript n", "稀疏稠密融合"], "difficulty": 3, "core": true, "importance": 1.0, "estimated_minutes": 90, "prerequisites": ["RAG-M03-N01", "RAG-M03-N03"], "objectives": ["组合关键词和向量检索结果", "理解分数归一化与基于排名融合的差异", "通过固定评测集确定融合参数"], "summary": "混合检索利用关键词的精确匹配和向量的语义匹配。RRF按照多个结果列表中的排名融合，不要求原始分数位于同一尺度，适合作为稳定基线。", "facts": [{"heading": "互补召回", "body": "稠密检索可以召回同义表达，稀疏检索擅长精确术语。先分别召回候选，再融合和重排，通常比只依赖单一路径更稳健。", "source_ids": ["SRC-OPENSEARCH-HYBRID"]}, {"heading": "分数归一化", "body": "不同检索器的原始分数含义和范围不同，直接加权可能让某一路径支配结果。分数融合需要归一化、权重和边界测试。", "source_ids": ["SRC-OPENSEARCH-HYBRID"]}, {"heading": "RRF", "body": "RRF根据文档在各结果列表中的名次累加倒数排名贡献，避免直接比较异构分数。rank constant影响头部排名差异，仍需在本地问题集上评测。", "source_ids": ["SRC-OPENSEARCH-HYBRID"]}, {"heading": "融合后仍需过滤与去重", "body": "同一父文档的高度重叠切片可能占满top-k。融合后应按权限和版本过滤、按内容哈希或父节点去重，并保留各检索路径的贡献，便于解释。", "source_ids": ["SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "混合检索就是把两种分数直接相加。", "correction": "需要处理分数尺度、权重、排名融合、过滤和去重。"}, {"wrong": "RRF不需要调参和评测。", "correction": "候选池大小、rank constant和去重规则都会影响结果。"}], "boundaries": ["融合前保留原始排名", "禁止跨权限融合", "必须报告单路与混合的消融结果"], "task": {"title": "实现BM25+向量的RRF混合检索", "description": "对固定问题集比较稀疏、稠密和混合三条路径，分析哪些查询被改善、哪些被损害。", "deliverable": "融合实现、消融报告与参数ADR", "rubric": ["有单路基线", "RRF可配置", "包含去重和过滤", "报告统计显著的错误类型"]}, "_module_name": "表示、索引与基础检索", "_chunks": [{"chunk_id": "6a4e0281-c2bf-56c9-9b34-5ff4d0f292ac", "evidence_id": "7d448bf9-e164-5a44-81cd-86a76d56dcfa", "title": "混合检索、分数融合与RRF：互补召回", "content": "知识点：混合检索、分数融合与RRF\n主题：互补召回\n稠密检索可以召回同义表达，稀疏检索擅长精确术语。先分别召回候选，再融合和重排，通常比只依赖单一路径更稳健。\n适用边界：融合前保留原始排名；禁止跨权限融合；必须报告单路与混合的消融结果", "difficulty_level": 3, "source_ids": ["SRC-OPENSEARCH-HYBRID"], "citation_text": "表示、索引与基础检索 / 混合检索、分数融合与RRF / 互补召回"}, {"chunk_id": "8d9a0faf-059d-550c-8c4b-46ef30642e18", "evidence_id": "3a1befcf-aede-53f8-9b53-b51f618c12b4", "title": "混合检索、分数融合与RRF：分数归一化", "content": "知识点：混合检索、分数融合与RRF\n主题：分数归一化\n不同检索器的原始分数含义和范围不同，直接加权可能让某一路径支配结果。分数融合需要归一化、权重和边界测试。\n适用边界：融合前保留原始排名；禁止跨权限融合；必须报告单路与混合的消融结果", "difficulty_level": 3, "source_ids": ["SRC-OPENSEARCH-HYBRID"], "citation_text": "表示、索引与基础检索 / 混合检索、分数融合与RRF / 分数归一化"}, {"chunk_id": "161e924d-c776-510f-b485-226593719af4", "evidence_id": "0c530834-1e07-54de-8e39-8511bc1658c0", "title": "混合检索、分数融合与RRF：RRF", "content": "知识点：混合检索、分数融合与RRF\n主题：RRF\nRRF根据文档在各结果列表中的名次累加倒数排名贡献，避免直接比较异构分数。rank constant影响头部排名差异，仍需在本地问题集上评测。\n适用边界：融合前保留原始排名；禁止跨权限融合；必须报告单路与混合的消融结果", "difficulty_level": 3, "source_ids": ["SRC-OPENSEARCH-HYBRID"], "citation_text": "表示、索引与基础检索 / 混合检索、分数融合与RRF / RRF"}, {"chunk_id": "1f0be406-ef15-56c4-93a2-e565f08acb9d", "evidence_id": "716788a5-719d-5bd2-b841-55fc952f6160", "title": "混合检索、分数融合与RRF：融合后仍需过滤与去重", "content": "知识点：混合检索、分数融合与RRF\n主题：融合后仍需过滤与去重\n同一父文档的高度重叠切片可能占满top-k。融合后应按权限和版本过滤、按内容哈希或父节点去重，并保留各检索路径的贡献，便于解释。\n适用边界：融合前保留原始排名；禁止跨权限融合；必须报告单路与混合的消融结果", "difficulty_level": 3, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "表示、索引与基础检索 / 混合检索、分数融合与RRF / 融合后仍需过滤与去重"}]}, {"id": "RAG-M04-N01", "module_id": "RAG-M04", "name": "查询理解、意图识别与查询改写", "aliases": ["query rewriting", "query understanding", "查询扩展"], "difficulty": 2, "core": true, "importance": 0.95, "estimated_minutes": 75, "prerequisites": ["RAG-M03-N04"], "objectives": ["识别定义、比较、步骤、故障、多跳和拒答意图", "把口语、指代和缩写转换为可检索表达", "控制查询扩展避免语义漂移"], "summary": "用户问题往往包含省略、上下文指代、拼写和多个子问题。查询处理应在不改变原意的前提下生成检索计划，并保留原始问题用于审计。", "facts": [{"heading": "意图决定检索策略", "body": "单点定义可直接混合检索；比较题需要同时召回多个对象；步骤题需要层级上下文；故障排查可能需要多轮证据；高风险或越权问题应直接进入拒答或人工路径。", "source_ids": ["SRC-GRAPHRAG-OFFICIAL", "SRC-NIST-AI-RMF"]}, {"heading": "规范化与改写", "body": "查询规范化包括大小写、全半角、别名、错别字和缩写展开。改写应输出原问题、规范化问题和改写理由，不能用改写后的问题覆盖原始输入。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "多查询扩展", "body": "一个复杂问题可生成若干互补查询，例如概念、步骤和风险三个子查询，再合并证据。扩展数量过多会引入噪声和成本，应设置上限并做证据覆盖检查。", "source_ids": ["SRC-RAGAS-2023"]}, {"heading": "防止语义漂移", "body": "改写模型可能把用户的限定条件、否定或时间范围改掉。系统需要对关键实体、范围和约束做一致性检查，无法确认时保留原查询或向用户追问。", "source_ids": ["SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "把问题改得越长越容易检索。", "correction": "冗余扩展会稀释关键术语，改写应服务于明确检索目标。"}, {"wrong": "改写后的问题可以替代用户原话。" "}]}, {"id": "RAG-M04-N02", "module_id": "RAG-M04", "name": "元数据过滤、租户隔离与权限检索", "aliases": ["metadata filter", "access control retrieval", "权限过滤"], "difficulty": 3, "core": true, "importance": 1.0, "estimated_minutes": 75, "prerequisites": ["RAG-M02-N04", "RAG-M04-N01"], "objectives": ["在召回前应用租户、角色、版本和有效期过滤", "防止检索侧数据越权", "验证过滤与近似索引的交互"], "summary": "权限必须在检索层实施，而不是先检索敏感内容再让生成模型“不要显示”。所有查询都应绑定调用者、组织、激活知识版本和允许的安全标签。", "facts": [{"heading": "检索前授权", "body": "请求进入检索器前由可信后端解析用户身份和权限，形成不可由模型修改的过滤条件。Agent只能补充查询意图，不能扩大允许访问的租户、文档或安全级别。", "source_ids": ["SRC-NIST-AI-RMF", "SRC-OWASP-PROMPT-INJECTION"]}, {"heading": "版本与有效期", "body": "过滤条件除组织和角色外，还应包括激活知识库版本、文档状态、有效时间和语言。这样可以防止已退役、未审批或未来生效内容进入答案。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "近似检索交互", "body": "近似向量索引可能在召回后应用过滤，导致满足条件的结果不足。应通过普通列索引、分区、部分索引、迭代扫描或扩大候选池验证结果数量和召回。", "source_ids": ["SRC-PGVECTOR-OFFICIAL"]}, {"heading": "越权测试", "body": "测试应包括跨租户ID、伪造过滤字段、提示注入要求忽略权限、已撤回文档和混合公开/敏感片段。日志中不能泄露被拒绝片段的正文。", "source_ids": ["SRC-OWASP-PROMPT-INJECTION", "SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "在Prompt里写“不要泄露敏感信息”就足够。", "correction": "模型不是授权边界，敏感证据必须在检索前被技术过滤。"}, {"wrong": "top-k返回不足只需降低过滤条件。", "correction": "不能为了数量放宽权限，应调整索引、候选池或明确返回证据不足。"}], "boundaries": ["权限条件由后端注入且不可被Agent覆盖", "拒绝日志不得包含敏感正文", "版本和有效期过滤为强制字段"], "task": {"title": "实现多租户安全检索测试", "description": "建立两个组织、三种角色和公开/内部/敏感资料，验证20个越权与边界场景。", "deliverable": "过滤中间件、测试数据和安全报告", "rubric": ["跨租户零泄露", "模型输入不含越权片段", "覆盖退役版本", "失败日志脱敏"]}, "_module_name": "检索增强与上下文工程", "_chunks": [{"chunk_id": "a8da5e87-aa8e-5a0a-aff0-422563bf8c74", "evidence_id": "060b18e5-ed29-50d7-9cf1-d2cb7ae22fed", "title": "元数据过滤、租户隔离与权限检索：检索前授权", "content": "知识点：元数据过滤、租户隔离与权限检索\n主题：检索前授权\n请求进入检索器前由可信后端解析用户身份和权限，形成不可由模型修改的过滤条件。Agent只能补充查询意图，不能扩大允许访问的租户、文档或安全级别。\n适用边界：权限条件由后端注入且不可被Agent覆盖；拒绝日志不得包含敏感正文；版本和有效期过滤为强制字段", "difficulty_level": 3, "source_ids": ["SRC-NIST-AI-RMF", "SRC-OWASP-PROMPT-INJECTION"], "citation_text": "检索增强与上下文工程 / 元数据过滤、租户隔离与权限检索 / 检索前授权"}, {"chunk_id": "5f5c1555-a4ea-5009-a1c9-299cf7644264", "evidence_id": "190248c5-ff2b-5d24-8f12-8dca4b602d96", "title": "元数据过滤、租户隔离与权限检索：版本与有效期", "content": "知识点：元数据过滤、租户隔离与权限检索\n主题：版本与有效期\n过滤条件除组织和角色外，还应包括激活知识库版本、文档状态、有效时间和语言。这样可以防止已退役、未审批或未来生效内容进入答案。\n适用边界：权限条件由后端注入且不可被Agent覆盖；拒绝日志不得包含敏感正文；版本和有效期过滤为强制字段", "difficulty_level": 3, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "检索增强与上下文工程 / 元数据过滤、租户隔离与权限检索 / 版本与有效期"}, {"chunk_id": "44b9fe52-ae93-5626-863b-a8c63ef02876", "evidence_id": "772c18e9-a423-5492-80df-214c3e326a87", "title": "元数据过滤、租户隔离与权限检索：近似检索交互", "content": "知识点：元数据过滤、租户隔离与权限检索\n主题：近似检索交互\n近似向量索引可能在召回后应用过滤，导致满足条件的结果不足。应通过普通列索引、分区、部分索引、迭代扫描或扩大候选池验证结果数量和召回。\n适用边界：权限条件由后端注入且不可被Agent覆盖；拒绝日志不得包含敏感正文；版本和有效期过滤为强制字段", "difficulty_level": 3, "source_ids": ["SRC-PGVECTOR-OFFICIAL"], "citation_text": "检索增强与上下文工程 / 元数据过滤、租户隔离与权限检索 / 近似检索交互"}, {"chunk_id": "fdb6fccf-a82c-563b-a002-9868072875e8", "evidence_id": "4e5f6c43-7704-5ab0-be5b-c059a68e3b4b", "title": "元数据过滤、租户隔离与权限检索：越权测试", "content": "知识点：元数据过滤、租户隔离与权限检索\n主题：越权测试\n测试应包括跨租户ID、伪造过滤字段、提示注入要求忽略权限、已撤回文档和混合公开/敏感片段。日志中不能泄露被拒绝片段的正文。\n适用边界：权限条件由后端注入且不可被Agent覆盖；拒绝日志不得包含敏感正文；版本和有效期过滤为强制字段", "difficulty_level": 3, "source_ids": ["SRC-OWASP-PROMPT-INJECTION", "SRC-NIST-AI-RMF"], "citation_text": "检索增强与上下文工程 / 元数据过滤、租户隔离与权限检索 / 越权测试"}]}, {"id": "RAG-M04-N03", "module_id": "RAG-M04", "name": "候选重排、交叉编码器与多阶段检索", "aliases": ["reranking", "cross-encoder", "多阶段检索"], "difficulty": 3, "core": true, "importance": 0.95, "estimated_minutes": 90, "prerequisites": ["RAG-M03-N04", "RAG-M04-N02"], "objectives": ["理解召回与精排的职责差异", "设计候选池和重排top-n参数", "测量重排收益、时延和失败模式"], "summary": "第一阶段检索追求召回，重排阶段用更精细的查询-片段交互提高头部相关性。重排不是替代召回；候选中没有正确证据时，再强的重排也无法恢复。", "facts": [{"heading": "两阶段职责", "body": "召回器在大规模语料中快速获取较大的候选池，重排器对有限候选做更昂贵的相关性判断。设计时分别设置candidate_k、rerank_k和最终context_k。", "source_ids": ["SRC-COLBERT-2020"]}, {"heading": "交叉编码与晚交互", "body": "交叉编码器可联合编码查询和片段，相关性通常更细致但成本高；晚交互方法预计算文档表示并保留词级交互，在效果和效率之间取折中。", "source_ids": ["SRC-COLBERT-2020"]}, {"heading": "评测重排收益", "body": "不能只看最终答案。应比较重排前后MRR、nDCG、首个相关证据排名、P95延迟和成本，并按查询类型分析，避免整体平均掩盖某类退化。", "source_ids": ["SRC-RAGAS-2023"]}, {"heading": "多样性与去重", "body": "纯相关性重排可能把多个近重复片段排在顶部。可加入父文档去重、知识节点覆盖或最大边际相关性约束，保证上下文既相关又覆盖必要子主题。", "source_ids": ["SRC-RAGAS-2023"]}], "misconceptions": [{"wrong": "重排器可以修复第一阶段漏检。", "correction": "重排只能重新排序已有候选，正确证据未召回时无法补回。"}, {"wrong": "重排模型越大越好。", "correction": "需同时满足时延、成本、领域适配和稳定性门禁。"}], "boundaries": ["保留重排前后排名", "候选池参数需版本化", "重排超时必须有降级路径"], "task": {"title": "完成重排器消融实验", "description": "在混合检索候选上比较无重排、交叉编码和规则增强重排，报告分查询类型结果。", "deliverable": "重排适配器、基准结果和上线门禁", "rubric": ["候选召回基线不变", "报告MRR/nDCG/P95", "包含重复片段控制", "有超时降级"]}, "_module_name": "检索增强与上下文工程", "_chunks": [{"chunk_id": "99acbaa3-dd19-5a6e-896b-3ea75dafbd1a", "evidence_id": "cea9d066-c4b0-5d51-826e-5bf6970b3b7b", "title": "候选重排、交叉编码器与多阶段检索：两阶段职责", "content": "知识点：候选重排、交叉编码器与多阶段检索\n主题：两阶段职责\n召回器在大规模语料中快速获取较大的候选池，重排器对有限候选做更昂贵的相关性判断。设计时分别设置candidate_k、rerank_k和最终context_k。\n适用边界：保留重排前后排名；候选池参数需版本化；重排超时必须有降级路径", "difficulty_level": 3, "source_ids": ["SRC-COLBERT-2020"], "citation_text": "检索增强与上下文工程 / 候选重排、交叉编码器与多阶段检索 / 两阶段职责"}, {"chunk_id": "ed370cd7-17e9-5b88-afcc-4f0efb7dcbd7", "evidence_id": "825fd4ce-5fd5-5a03-b094-ae387480ea2d", "title": "候选重排、交叉编码器与多阶段检索：交叉编码与晚交互", "content": "知识点：候选重排、交叉编码器与多阶段检索\n主题：交叉编码与晚交互\n交叉编码器可联合编码查询和片段，相关性通常更细致但成本高；晚交互方法预计算文档表示并保留词级交互，在效果和效率之间取折中。\n适用边界：保留重排前后排名；候选池参数需版本化；重排超时必须有降级路径", "difficulty_level": 3, "source_ids": ["SRC-COLBERT-2020"], "citation_text": "检索增强与上下文工程 / 候选重排、交叉编码器与多阶段检索 / 交叉编码与晚交互"}, {"chunk_id": "918b2362-2d21-5bab-a6e6-d4a4807ff395", "evidence_id": "f485d3df-f7e5-552d-b6f5-f7cb733477a0", "title": "候选重排、交叉编码器与多阶段检索：评测重排收益", "content": "知识点：候选重排、交叉编码器与多阶段检索\n主题：评测重排收益\n不能只看最终答案。应比较重排前后MRR、nDCG、首个相关证据排名、P95延迟和成本，并按查询类型分析，避免整体平均掩盖某类退化。\n适用边界：保留重排前后排名；候选池参数需版本化；重排超时必须有降级路径", "difficulty_level": 3, "source_ids": ["SRC-RAGAS-2023"], "citation_text": "检索增强与上下文工程 / 候选重排、交叉编码器与多阶段检索 / 评测重排收益"}, {"chunk_id": "ae788b2b-0eb4-581f-b2e6-bff849eb09b8", "evidence_id": "77e2ed0e-4e52-5024-90b5-73020341f9ce", "title": "候选重排、交叉编码器与多阶段检索：多样性与去重", "content": "知识点：候选重排、交叉编码器与多阶段检索\n主题：多样性与去重\n纯相关性重排可能把多个近重复片段排在顶部。可加入父文档去重、知识节点覆盖或最大边际相关性约束，保证上下文既相关又覆盖必要子主题。\n适用边界：保留重排前后排名；候选池参数需版本化；重排超时必须有降级路径", "difficulty_level": 3, "source_ids": ["SRC-RAGAS-2023"], "citation_text": "检索增强与上下文工程 / 候选重排、交叉编码器与多阶段检索 / 多样性与去重"}]}, {"id": "RAG-M04-N04", "module_id": "RAG-M04", "name": "上下文选择、压缩、排序与引用封装", "aliases": ["context packing", "context compression", "上下文工程"], "difficulty": 4, "core": true, "importance": 1.0, "estimated_minutes": 90, "prerequisites": ["RAG-M04-N03"], "objectives": ["在token预算内选择高价值证据", "处理重复、冲突和长上下文位置问题", "构建带证据ID的上下文包"], "summary": "最终送入模型的不是检索结果列表，而是经过权限校验、去重、冲突标记、压缩和排序的证据包。更多上下文不一定更好，关键证据应保持完整并可引用。", "facts": [{"heading": "预算分配", "body": "上下文预算需为系统指令、用户问题、证据和输出预留空间。证据选择应综合相关性、权威性、时效性、覆盖度和重复度，而不是简单截取top-k。", "source_ids": ["SRC-LOST-MIDDLE-2024", "SRC-NIST-AI-RMF"]}, {"heading": "压缩不改写事实", "body": "抽取式压缩优先保留原句、条件和来源位置；生成式摘要需标记为派生内容并经事实检查。不能为了短而删除例外、否定或单位。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "顺序与位置", "body": "长上下文研究显示模型对相关信息位置可能敏感。工程上可把最关键证据放在显著位置、按子问题分组，并避免在中间堆入大量低价值噪声。", "source_ids": ["SRC-LOST-MIDDLE-2024"]}, {"heading": "证据封装", "body": "每个上下文块应包含evidence_id、标题、来源、版本、位置和正文。生成结果中的关键陈述必须引用这些ID，审核器再验证引用是否真正支持该陈述。", "source_ids": ["SRC-COMPETITION-XH-202630", "SRC-RAGAS-2023"]}], "misconceptions": [{"wrong": "把检索到的50段全部放进上下文最安全。", "correction": "过多噪声会增加成本并可能降低模型对关键证据的利用。"}, {"wrong": "生成式摘要天然等价于原文。", "correction": "摘要可能遗漏条件或引入表述偏差，必须保留原始证据和审核。"}], "boundaries": ["关键条件不得因压缩丢失", "证据包必须可复现", "冲突证据不得静默合并"], "task": {"title": "设计可引用的上下文打包器", "description": "给定20个候选片段，在固定token预算下完成去重、覆盖、冲突标记、排序和引用封装，并测试位置扰动。", "deliverable": "上下文打包器与评测报告", "rubric": ["预算可配置", "支持冲突标记", "引用ID完整", "包含位置敏感性测试"]}, "_module_name": "检索增强与上下文工程", "_chunks": [{"chunk_id": "41fb494d-a279-55ea-b86e-116eff6b4b01", "evidence_id": "24c5e9d9-1f5f-5cb1-afb7-793c9235f9c3", "title": "上下文选择、压缩、排序与引用封装：预算分配", "content": "知识点：上下文选择、压缩、排序与引用封装\n主题：预算分配\n上下文预算需为系统指令、用户问题、证据和输出预留空间。证据选择应综合相关性、权威性、时效性、覆盖度和重复度，而不是简单截取top-k。\n适用边界：关键条件不得因压缩丢失；证据包必须可复现；冲突证据不得静默合并", "difficulty_level": 4, "source_ids": ["SRC-LOST-MIDDLE-2024", "SRC-NIST-AI-RMF"], "citation_text": "检索增强与上下文工程 / 上下文选择、压缩、排序与引用封装 / 预算分配"}, {"chunk_id": "05ad4aed-b560-5a08-8fbe-17d5705ac7fc", "evidence_id": "d6441eb5-e28a-5b0b-9cd7-f1b5b94fb8a9", "title": "上下文选择、压缩、排序与引用封装：压缩不改写事实", "content": "知识点：上下文选择、压缩、排序与引用封装\n主题：压缩不改写事实\n抽取式压缩优先保留原句、条件和来源位置；生成式摘要需标记为派生内容并经事实检查。不能为了短而删除例外、否定或单位。\n适用边界：关键条件不得因压缩丢失；证据包必须可复现；冲突证据不得静默合并", "difficulty_level": 4, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "检索增强与上下文工程 / 上下文选择、压缩、排序与引用封装 / 压缩不改写事实"}, {"chunk_id": "e4efc98c-17e6-592a-86d5-eca667b0a0cd", "evidence_id": "382852a1-407f-5cb3-910f-79f9e64b28fc", "title": "上下文选择、压缩、排序与引用封装：顺序与位置", "content": "知识点：上下文选择、压缩、排序与引用封装\n主题：顺序与位置\n长上下文研究显示模型对相关信息位置可能敏感。工程上可把最关键证据放在显著位置、按子问题分组，并避免在中间堆入大量低价值噪声。\n适用边界：关键条件不得因压缩丢失；证据包必须可复现；冲突证据不得静默合并", "difficulty_level": 4, "source_ids": ["SRC-LOST-MIDDLE-2024"], "citation_text": "检索增强与上下文工程 / 上下文选择、压缩、排序与引用封装 / 顺序与位置"}, {"chunk_id": "d810c699-ac4e-5509-b79b-e1ab467823a0", "evidence_id": "b7d7f4c7-aef7-535b-a226-a6cfbb0300ef", "title": "上下文选择、压缩、排序与引用封装：证据封装", "content": "知识点：上下文选择、压缩、排序与引用封装\n主题：证据封装\n每个上下文块应包含evidence_id、标题、来源、版本、位置和正文。生成结果中的关键陈述必须引用这些ID，审核器再验证引用是否真正支持该陈述。\n适用边界：关键条件不得因压缩丢失；证据包必须可复现；冲突证据不得静默合并", "difficulty_level": 4, "source_ids": ["SRC-COMPETITION-XH-202630", "SRC-RAGAS-2023"], "citation_text": "检索增强与上下文工程 / 上下文选择、压缩、排序与引用封装 / 证据封装"}]}, {"id": "RAG-M05-N01", "module_id": "RAG-M05", "name": "证据约束生成、引用与答案结构", "aliases": ["grounded generation", "faithful generation", "证据约束回答"], "difficulty": 2, "core": true, "importance": 1.0, "estimated_minutes": 75, "prerequisites": ["RAG-M04-N04"], "objectives": ["设计只基于证据生成的提示和输出结构", "把关键陈述与evidence_id绑定", "区分事实陈述、推断和教学改写"], "summary": "可信生成要求模型明确知道可用证据、允许的任务和禁止扩写范围。答案中的关键专业结论应绑定证据，推断应被标注，证据不足时不能用常识补齐。", "facts": [{"heading": "生成契约", "body": "生成器输入应包含目标学习者、知识节点、难度、资源形态、证据包和禁止项；输出应使用固定Schema，分别承载正文、关键点、代码、引用、置信度和缺失证据。", "source_ids": ["SRC-COMPETITION-XH-202630", "SRC-OPENAPI-31"]}, {"heading": "陈述级证据绑定", "body": "仅在文章末尾列来源不足以证明每个结论。关键定义、步骤、参数和风险说明应能映射到一个或多个evidence_id，审核器逐项检查支持关系。", "source_ids": ["SRC-RAGAS-2023"]}, {"heading": "事实与教学转换", "body": "个性化可以改变解释方式、例子、顺序和练习难度，但不能改变专业事实。系统应区分来源支持的事实、基于事实的教学重组和模型推断，避免把类比当作严格定义。", "source_ids": ["SRC-COMPETITION-XH-202630"]}, {"heading": "结构化输出", "body": "JSON Schema能减少字段缺失和类型错误，但不能保证事实正确。应同时进行Schema校验、引用检查、事实一致性检查和难度适配检查。", "source_ids": ["SRC-OPENAPI-31", "SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "提示词写“不要幻觉”就能保证可信。", "correction": "还需要证据包、结构化输出、引用验证、拒答和审核。"}, {"wrong": "答案带了来源链接就一定有依据。", "correction": "来源可能与具体陈述无关，必须验证支持关系。"}], "boundaries": ["无证据的专业陈述不得发布", "类比必须标记其边界", "输出先过Schema再进入事实审核"], "task": {"title": "实现证据约束资源生成模板", "description": "根据同一组证据为初级和进阶学习者生成两份资源，要求关键段落引用证据并区分事实与类比。", "deliverable": "Prompt、Schema输出和引用映射", "rubric": ["两个难度确有差异", "事实保持一致", "关键陈述有证据", "无证据时明确缺口"]}, "_module_name": "可信生成与安全控制", "_chunks": [{"chunk_id": "220a8d5d-8daf-5d38-a7cc-35177bb63d6b", "evidence_id": "5a8c0f89-8b27-5101-ae21-3040ab75bbc2", "title": "证据约束生成、引用与答案结构：生成契约", "content": "知识点：证据约束生成、引用与答案结构\n主题：生成契约\n生成器输入应包含目标学习者、知识节点、难度、资源形态、证据包和禁止项；输出应使用固定Schema，分别承载正文、关键点、代码、引用、置信度和缺失证据。\n适用边界：无证据的专业陈述不得发布；类比必须标记其边界；输出先过Schema再进入事实审核", "difficulty_level": 2, "source_ids": ["SRC-COMPETITION-XH-202630", "SRC-OPENAPI-31"], "citation_text": "可信生成与安全控制 / 证据约束生成、引用与答案结构 / 生成契约"}, {"chunk_id": "d20a52a8-f272-53be-998b-a39463f76359", "evidence_id": "09f16411-041b-5ae5-bb68-b3f3c8583d6c", "title": "证据约束生成、引用与答案结构：陈述级证据绑定", "content": "知识点：证据约束生成、引用与答案结构\n主题：陈述级证据绑定\n仅在文章末尾列来源不足以证明每个结论。关键定义、步骤、参数和风险说明应能映射到一个或多个evidence_id，审核器逐项检查支持关系。\n适用边界：无证据的专业陈述不得发布；类比必须标记其边界；输出先过Schema再进入事实审核", "difficulty_level": 2, "source_ids": ["SRC-RAGAS-2023"], "citation_text": "可信生成与安全控制 / 证据约束生成、引用与答案结构 / 陈述级证据绑定"}, {"chunk_id": "3396f72a-4b12-518a-8fb4-0c04449450d1", "evidence_id": "621966e1-03ad-5c30-bf27-683c4ace0ac7", "title": "证据约束生成、引用与答案结构：事实与教学转换", "content": "知识点：证据约束生成、引用与答案结构\n主题：事实与教学转换\n个性化可以改变解释方式、例子、顺序和练习难度，但不能改变专业事实。系统应区分来源支持的事实、基于事实的教学重组和模型推断，避免把类比当作严格定义。\n适用边界：无证据的专业陈述不得发布；类比必须标记其边界；输出先过Schema再进入事实审核", "difficulty_level": 2, "source_ids": ["SRC-COMPETITION-XH-202630"], "citation_text": "可信生成与安全控制 / 证据约束生成、引用与答案结构 / 事实与教学转换"}, {"chunk_id": "e7ff518a-4676-5b49-b2e3-fa8788bc6613", "evidence_id": "9740184c-c0fc-50fe-9086-8aee85a60791", "title": "证据约束生成、引用与答案结构：结构化输出", "content": "知识点：证据约束生成、引用与答案结构\n主题：结构化输出\nJSON Schema能减少字段缺失和类型错误，但不能保证事实正确。应同时进行Schema校验、引用检查、事实一致性检查和难度适配检查。\n适用边界：无证据的专业陈述不得发布；类比必须标记其边界；输出先过Schema再进入事实审核", "difficulty_level": 2, "source_ids": ["SRC-OPENAPI-31", "SRC-NIST-AI-RMF"], "citation_text": "可信生成与安全控制 / 证据约束生成、引用与答案结构 / 结构化输出"}]}, {"id": "RAG-M05-N02", "module_id": "RAG-M05", "name": "证据不足、拒答、追问与人工转交", "aliases": ["abstention", "refusal", "insufficient evidence", "拒答策略"], "difficulty": 2, "core": true, "importance": 1.0, "estimated_minutes": 60, "prerequisites": ["RAG-M05-N01"], "objectives": ["定义证据充分性和拒答阈值", "区分拒答、追问、扩大检索和人工审核", "避免系统自信回答知识库外问题"], "summary": "可信系统必须知道何时不回答。证据不足不应被视为失败，而应触发扩大检索、澄清问题、说明知识边界或转人工的确定性策略。", "facts": [{"heading": "证据充分性", "body": "证据是否充分不仅看相似度，还要看是否覆盖问题中的关键实体、时间、条件和结论，来源是否可信，是否存在相互冲突，以及答案是否需要知识库外推断。", "source_ids": ["SRC-RAGAS-2023", "SRC-NIST-AI-RMF"]}, {"heading": "四种动作", "body": "可选择重新检索、向用户追问、明确拒答或转人工。模糊问题优先追问；可通过新检索计划补足的进入重试；高风险或冲突问题转人工；知识库外问题明确说明范围。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "拒答内容", "body": "高质量拒答应说明缺少什么证据、系统已检查的范围和用户可提供的信息，但不能泄露权限外资料，也不能编造一个貌似有用的答案。", "source_ids": ["SRC-OWASP-PROMPT-INJECTION", "SRC-NIST-AI-RMF"]}, {"heading": "拒答评测", "body": "评测集必须同时包含应回答和应拒答的问题，测量正确拒答率、错误拒答率和越权泄露率。只提高拒答率会损害可用性，因此需要平衡。", "source_ids": ["SRC-RAGAS-2023"]}], "misconceptions": [{"wrong": "拒答越多越安全。", "correction": "过度拒答会降低任务完成率，应通过阈值和问题类型评测平衡。"}, {"wrong": "找不到证据时可以用模型常识补充。", "correction": "专业培训内容应明确标记知识库外信息，默认不得直接发布。"}], "boundaries": ["高风险无证据必须拒答或转人工", "拒答不得暴露受限资料", "每次拒答记录原因代码"], "task": {"title": "构建回答/追问/拒答/人工四分类策略", "description": "准备40个边界问题并实现路由，分析错误拒答和错误回答。", "deliverable": "决策表、测试集和混淆矩阵", "rubric": ["四类动作边界清晰", "包含越权与冲突问题", "报告两类错误率", "理由可审计"]}, "_module_name": "可信生成与安全控制", "_chunks": [{"chunk_id": "b5cfe49a-0d3c-56b4-a74c-e611c4ee4002", "evidence_id": "af19c081-bf31-5030-801c-104069fdfa03", "title": "证据不足、拒答、追问与人工转交：证据充分性", "content": "知识点：证据不足、拒答、追问与人工转交\n主题：证据充分性\n证据是否充分不仅看相似度，还要看是否覆盖问题中的关键实体、时间、条件和结论，来源是否可信，是否存在相互冲突，以及答案是否需要知识库外推断。\n适用边界：高风险无证据必须拒答或转人工；拒答不得暴露受限资料；每次拒答记录原因代码", "difficulty_level": 2, "source_ids": ["SRC-RAGAS-2023", "SRC-NIST-AI-RMF"], "citation_text": "可信生成与安全控制 / 证据不足、拒答、追问与人工转交 / 证据充分性"}, {"chunk_id": "c6e63302-562b-51a7-810c-b69556647b42", "evidence_id": "c56bbccd-b251-5073-b1ff-750e44f7463d", "title": "证据不足、拒答、追问与人工转交：四种动作", "content": "知识点：证据不足、拒答、追问与人工转交\n主题：四种动作\n可选择重新检索、向用户追问、明确拒答或转人工。模糊问题优先追问；可通过新检索计划补足的进入重试；高风险或冲突问题转人工；知识库外问题明确说明范围。\n适用边界：高风险无证据必须拒答或转人工；拒答不得暴露受限资料；每次拒答记录原因代码", "difficulty_level": 2, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "可信生成与安全控制 / 证据不足、拒答、追问与人工转交 / 四种动作"}, {"chunk_id": "d980ca1d-39af-5c30-b047-a354c7f46378", "evidence_id": "29ed0fa1-79e7-50dc-8ee3-6758da64fb0f", "title": "证据不足、拒答、追问与人工转交：拒答内容", "content": "知识点：证据不足、拒答、追问与人工转交\n主题：拒答内容\n高质量拒答应说明缺少什么证据、系统已检查的范围和用户可提供的信息，但不能泄露权限外资料，也不能编造一个貌似有用的答案。\n适用边界：高风险无证据必须拒答或转人工；拒答不得暴露受限资料；每次拒答记录原因代码", "difficulty_level": 2, "source_ids": ["SRC-OWASP-PROMPT-INJECTION", "SRC-NIST-AI-RMF"], "citation_text": "可信生成与安全控制 / 证据不足、拒答、追问与人工转交 / 拒答内容"}, {"chunk_id": "55f4fc0d-6bd7-54a0-8371-d90b1fc2a83f", "evidence_id": "a765ce4c-c074-57e5-bfab-cceb6b9ca895", "title": "证据不足、拒答、追问与人工转交：拒答评测", "content": "知识点：证据不足、拒答、追问与人工转交\n主题：拒答评测\n评测集必须同时包含应回答和应拒答的问题，测量正确拒答率、错误拒答率和越权泄露率。只提高拒答率会损害可用性，因此需要平衡。\n适用边界：高风险无证据必须拒答或转人工；拒答不得暴露受限资料；每次拒答记录原因代码", "difficulty_level": 2, "source_ids": ["SRC-RAGAS-2023"], "citation_text": "可信生成与安全控制 / 证据不足、拒答、追问与人工转交 / 拒答评测"}]}, {"id": "RAG-M05-N03", "module_id": "RAG-M05", "name": "幻觉分类、事实审核与交叉验证", "aliases": ["hallucination audit", "事实一致性", "内容审核"], "difficulty": 3, "core": true, "importance": 1.0, "estimated_minutes": 90, "prerequisites": ["RAG-M05-N01", "RAG-M05-N02"], "objectives": ["区分无依据、矛盾、引用错配和过度概括", "设计审核智能体的独立证据检查", "计算专业知识谬误率"], "summary": "幻觉不能只用一个总分表示。审核应逐项识别无证据陈述、与证据矛盾、引用不支持、条件丢失、数值或代码错误，并给出通过、修改、补检索或人工审核动作。", "facts": [{"heading": "错误分类", "body": "常见类型包括：证据中不存在的事实、与证据相反的陈述、把局部条件泛化、引用与陈述无关、数字单位错误、代码与解释不一致，以及把不确定推断写成确定结论。", "source_ids": ["SRC-RAGAS-2023", "SRC-NIST-AI-RMF"]}, {"heading": "独立审核上下文", "body": "审核器应重新读取原始证据和生成结果，而不是只依赖生成器的自评。它可以使用不同Prompt、规则或模型，并输出检查项、问题位置、严重度和修复动作。", "source_ids": ["SRC-COMPETITION-XH-202630"]}, {"heading": "交叉验证", "body": "对高风险结论，可让事实核验、难度适配和代码验证分别给出结果，再由审核或仲裁节点综合。多智能体价值在于不同职责和证据，而不是多个角色重复赞同。", "source_ids": ["SRC-COMPETITION-XH-202630"]}, {"heading": "谬误率口径", "body": "专业知识谬误率应定义为被人工或权威规则判定为错误的专业陈述数除以被审查专业陈述总数。测试集、抽样方式、审核者一致性和置信区间应记录。", "source_ids": ["SRC-COMPETITION-XH-202630", "SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "让同一个模型再读一遍就叫交叉验证。", "correction": "有效交叉验证需要独立输入、检查标准和可比较输出。"}, {"wrong": "整体读起来通顺就说明专业正确。", "correction": "流畅度与事实正确性无直接保证，必须逐陈述核对。"}], "boundaries": ["审核不得只使用生成器摘要", "阻断级问题禁止自动发布", "谬误率必须使用固定口径"], "task": {"title": "实现资源审核Agent规则与样例集", "description": "为20份包含真实错误和诱导错误的资源生成审核结果，输出定位、严重度和修复动作。", "deliverable": "审核Schema输出、黄金标签和一致性报告", "rubric": ["至少六类错误", "严重度边界明确", "审核引用原始证据", "阻断项召回率达到门禁"]}, "_module_name": "可信生成与安全控制", "_chunks": [{"chunk_id": "a094a244-18a0-5a59-a68b-cfc812a87067", "evidence_id": "d2eaf759-6ded-5884-918f-e0e4e66766ba", "title": "幻觉分类、事实审核与交叉验证：错误分类", "content": "知识点：幻觉分类、事实审核与交叉验证\n主题：错误分类\n常见类型包括：证据中不存在的事实、与证据相反的陈述、把局部条件泛化、引用与陈述无关、数字单位错误、代码与解释不一致，以及把不确定推断写成确定结论。\n适用边界：审核不得只使用生成器摘要；阻断级问题禁止自动发布；谬误率必须使用固定口径", "difficulty_level": 3, "source_ids": ["SRC-RAGAS-2023", "SRC-NIST-AI-RMF"], "citation_text": "可信生成与安全控制 / 幻觉分类、事实审核与交叉验证 / 错误分类"}, {"chunk_id": "da4f5f84-c14f-5c86-9883-8a014ec5d7d6", "evidence_id": "370b0b20-3e5b-5db5-bf19-622c6c4717e1", "title": "幻觉分类、事实审核与交叉验证：独立审核上下文", "content": "知识点：幻觉分类、事实审核与交叉验证\n主题：独立审核上下文\n审核器应重新读取原始证据和生成结果，而不是只依赖生成器的自评。它可以使用不同Prompt、规则或模型，并输出检查项、问题位置、严重度和修复动作。\n适用边界：审核不得只使用生成器摘要；阻断级问题禁止自动发布；谬误率必须使用固定口径", "difficulty_level": 3, "source_ids": ["SRC-COMPETITION-XH-202630"], "citation_text": "可信生成与安全控制 / 幻觉分类、事实审核与交叉验证 / 独立审核上下文"}, {"chunk_id": "12ff3216-5c69-5c52-ac4a-0264f3e438d5", "evidence_id": "16963fcf-b840-5d52-a6aa-faa7ce33f419", "title": "幻觉分类、事实审核与交叉验证：交叉验证", "content": "知识点：幻觉分类、事实审核与交叉验证\n主题：交叉验证\n对高风险结论，可让事实核验、难度适配和代码验证分别给出结果，再由审核或仲裁节点综合。多智能体价值在于不同职责和证据，而不是多个角色重复赞同。\n适用边界：审核不得只使用生成器摘要；阻断级问题禁止自动发布；谬误率必须使用固定口径", "difficulty_level": 3, "source_ids": ["SRC-COMPETITION-XH-202630"], "citation_text": "可信生成与安全控制 / 幻觉分类、事实审核与交叉验证 / 交叉验证"}, {"chunk_id": "5b24af88-6a20-5d05-bc86-c6d2c8b652a6", "evidence_id": "ce4b5efc-3fd0-513c-a7bc-8c51b0a5f37b", "title": "幻觉分类、事实审核与交叉验证：谬误率口径", "content": "知识点：幻觉分类、事实审核与交叉验证\n主题：谬误率口径\n专业知识谬误率应定义为被人工或权威规则判定为错误的专业陈述数除以被审查专业陈述总数。测试集、抽样方式、审核者一致性和置信区间应记录。\n适用边界：审核不得只使用生成器摘要；阻断级问题禁止自动发布；谬误率必须使用固定口径", "difficulty_level": 3, "source_ids": ["SRC-COMPETITION-XH-202630", "SRC-NIST-AI-RMF"], "citation_text": "可信生成与安全控制 / 幻觉分类、事实审核与交叉验证 / 谬误率口径"}]}, {"id": "RAG-M05-N04", "module_id": "RAG-M05", "name": "提示注入、不可信文档与知识库安全", "aliases": ["prompt injection", "indirect prompt injection", "RAG security"], "difficulty": 4, "core": true, "importance": 1.0, "estimated_minutes": 90, "prerequisites": ["RAG-M02-N01", "RAG-M04-N02", "RAG-M05-N03"], "objectives": ["识别用户直接注入和文档间接注入", "把知识内容与系统指令隔离", "设计输入、工具、输出和发布多层防线"], "summary": "RAG会把外部文档送入模型，因此文档中的恶意指令可能影响模型。所有检索内容都应被视为不可信数据，不能获得系统指令或工具权限。", "facts": [{"heading": "直接与间接注入", "body": "直接注入来自用户要求忽略规则；间接注入隐藏在网页、PDF、邮件或代码注释中，待文档被检索后影响模型。知识库接入和运行时都必须检测。", "source_ids": ["SRC-OWASP-PROMPT-INJECTION"]}, {"heading": "指令与数据分离", "body": "系统Prompt应明确证据块只是数据，不执行其中指令；使用结构化标签封装证据，并避免把敏感系统提示、工具描述和密钥放入可被文档覆盖的区域。", "source_ids": ["SRC-OWASP-PROMPT-INJECTION"]}, {"heading": "最小工具权限", "body": "检索内容不能决定调用哪个高权限工具或修改权限过滤。工具参数需要Schema校验、允许列表、租户上下文和后端授权，危险操作必须人工确认。", "source_ids": ["SRC-OWASP-PROMPT-INJECTION", "SRC-NIST-AI-RMF"]}, {"heading": "多层检测与响应", "body": "接入阶段扫描可疑指令和脚本；检索阶段过滤来源；生成阶段限制行为；输出阶段检测泄露和越权；事件进入审计日志。无法确认的高风险内容隔离而非自动发布。", "source_ids": ["SRC-OWASP-PROMPT-INJECTION", "SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "只有用户输入会提示注入。", "correction": "被检索的外部文档同样可能包含间接注入。"}, {"wrong": "过滤“ignore previous instructions”一个短语即可。", "correction": "攻击可改写、编码或跨片段传播，需要结构隔离、权限控制和行为验证。"}], "boundaries": ["检索证据永远视为不可信数据", "Agent不得从文档获得额外权限", "可疑来源先隔离后审核"], "task": {"title": "完成RAG提示注入红队测试", "description": "设计直接、间接、编码、跨片段和工具诱导五类攻击，验证知识接入、检索、生成和输出防线。", "deliverable": "攻击集、防护实现和残余风险报告", "rubric": ["至少25个攻击样例", "覆盖五类攻击", "无敏感数据泄露", "记录误报与漏报"]}, "_module_name": "可信生成与安全控制", "_chunks": [{"chunk_id": "c2ad52da-b7e4-5002-86be-806f95166acc", "evidence_id": "b04e4952-9eb2-502e-9cfe-41d8bd62bc49", "title": "提示注入、不可信文档与知识库安全：直接与间接注入", "content": "知识点：提示注入、不可信文档与知识库安全\n主题：直接与间接注入\n直接注入来自用户要求忽略规则；间接注入隐藏在网页、PDF、邮件或代码注释中，待文档被检索后影响模型。知识库接入和运行时都必须检测。\n适用边界：检索证据永远视为不可信数据；Agent不得从文档获得额外权限；可疑来源先隔离后审核", "difficulty_level": 4, "source_ids": ["SRC-OWASP-PROMPT-INJECTION"], "citation_text": "可信生成与安全控制 / 提示注入、不可信文档与知识库安全 / 直接与间接注入"}, {"chunk_id": "408bb93f-43f5-58ee-9bfa-4b3ab26f9d20", "evidence_id": "82baf3c7-5e46-5051-9dc0-ca20b8b92ff6", "title": "提示注入、不可信文档与知识库安全：指令与数据分离", "content": "知识点：提示注入、不可信文档与知识库安全\n主题：指令与数据分离\n系统Prompt应明确证据块只是数据，不执行其中指令；使用结构化标签封装证据，并避免把敏感系统提示、工具描述和密钥放入可被文档覆盖的区域。\n适用边界：检索证据永远视为不可信数据；Agent不得从文档获得额外权限；可疑来源先隔离后审核", "difficulty_level": 4, "source_ids": ["SRC-OWASP-PROMPT-INJECTION"], "citation_text": "可信生成与安全控制 / 提示注入、不可信文档与知识库安全 / 指令与数据分离"}, {"chunk_id": "c17c8403-427e-511e-b71e-f0aeb13840c8", "evidence_id": "36517c9a-c0cd-5c02-a8ba-8efdaf33764a", "title": "提示注入、不可信文档与知识库安全：最小工具权限", "content": "知识点：提示注入、不可信文档与知识库安全\n主题：最小工具权限\n检索内容不能决定调用哪个高权限工具或修改权限过滤。工具参数需要Schema校验、允许列表、租户上下文和后端授权，危险操作必须人工确认。\n适用边界：检索证据永远视为不可信数据；Agent不得从文档获得额外权限；可疑来源先隔离后审核", "difficulty_level": 4, "source_ids": ["SRC-OWASP-PROMPT-INJECTION", "SRC-NIST-AI-RMF"], "citation_text": "可信生成与安全控制 / 提示注入、不可信文档与知识库安全 / 最小工具权限"}, {"chunk_id": "58edf566-3ea1-50e3-878a-13e47ee43e67", "evidence_id": "56475a80-f5aa-571b-96a9-5cf4a4a59630", "title": "提示注入、不可信文档与知识库安全：多层检测与响应", "content": "知识点：提示注入、不可信文档与知识库安全\n主题：多层检测与响应\n接入阶段扫描可疑指令和脚本；检索阶段过滤来源；生成阶段限制行为；输出阶段检测泄露和越权；事件进入审计日志。无法确认的高风险内容隔离而非自动发布。\n适用边界：检索证据永远视为不可信数据；Agent不得从文档获得额外权限；可疑来源先隔离后审核", "difficulty_level": 4, "source_ids": ["SRC-OWASP-PROMPT-INJECTION", "SRC-NIST-AI-RMF"], "citation_text": "可信生成与安全控制 / 提示注入、不可信文档与知识库安全 / 多层检测与响应"}]}, {"id": "RAG-M06-N01", "module_id": "RAG-M06", "name": "检索评测：Hit Rate、Recall、MRR与nDCG", "aliases": ["retrieval evaluation", "Recall@k", "MRR", "nDCG"], "difficulty": 2, "core": true, "importance": 1.0, "estimated_minutes": 90, "prerequisites": ["RAG-M01-N04", "RAG-M04-N03"], "objectives": ["构建查询与相关证据标注集", "计算常用检索指标并解释差异", "按查询类型定位检索失败"], "summary": "检索评测必须脱离生成模型单独进行。Hit Rate关注是否命中，Recall关注相关证据覆盖，MRR关注首个相关结果位置，nDCG考虑多级相关性和排序。", "facts": [{"heading": "评测单元", "body": "每个案例至少包含query、预期知识节点或证据、查询类型、权限上下文和可选的多级相关性标签。测试集要与开发样例隔离，并记录标注依据。", "source_ids": ["SRC-RAGAS-2023"]}, {"heading": "Hit与Recall", "body": "Hit@k只判断top-k是否至少出现一个相关结果；Recall@k衡量相关结果被覆盖的比例。多证据问题只看Hit可能掩盖关键证据缺失。", "source_ids": ["SRC-RAGAS-2023"]}, {"heading": "MRR与nDCG", "body": "MRR关注首个相关结果的倒数排名，适合单一主要证据；nDCG可处理多个结果和不同相关等级，更适合评估排序整体质量。", "source_ids": ["SRC-RAGAS-2023"]}, {"heading": "分层分析", "body": "总平均值之外应按定义、精确术语、比较、步骤、多跳、中文缩写和安全问题分组。系统可能总体达标但在某个关键类别严重失败。", "source_ids": ["SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "Hit@5高就说明上下文一定优质。", "correction": "还要看其他相关证据、重复噪声、排序和上下文精度。"}, {"wrong": "用最终模型答案评估检索即可。", "correction": "生成模型可能凭记忆答对或误用证据，必须单独评测检索。"}], "boundaries": ["测试集需固定版本", "标注需保留依据", "发布报告必须包含分类型指标"], "task": {"title": "建立100条检索黄金集", "description": "覆盖八类查询，标注相关节点和证据，输出Hit@1/5、Recall@5、MRR、nDCG@10。", "deliverable": "黄金集、评测脚本和错误报告", "rubric": ["不少于100条", "至少八类查询", "指标实现有单元测试", "错误可追踪到切片或路由"]}, "_module_name": "评测、观测与持续改进", "_chunks": [{"chunk_id": "ca96e49a-8b39-542b-bdd9-d6c9119c43cf", "evidence_id": "adffd192-5ddc-5a39-b49e-54daa48cbee2", "title": "检索评测：Hit Rate、Recall、MRR与nDCG：评测单元", "content": "知识点：检索评测：Hit Rate、Recall、MRR与nDCG\n主题：评测单元\n每个案例至少包含query、预期知识节点或证据、查询类型、权限上下文和可选的多级相关性标签。测试集要与开发样例隔离，并记录标注依据。\n适用边界：测试集需固定版本；标注需保留依据；发布报告必须包含分类型指标", "difficulty_level": 2, "source_ids": ["SRC-RAGAS-2023"], "citation_text": "评测、观测与持续改进 / 检索评测：Hit Rate、Recall、MRR与nDCG / 评测单元"}, {"chunk_id": "07483be6-17c2-5e51-92e9-cac2ffa66f7c", "evidence_id": "b5f3a63c-bf7f-5ec5-bc9a-017bdbad9ed8", "title": "检索评测：Hit Rate、Recall、MRR与nDCG：Hit与Recall", "content": "知识点：检索评测：Hit Rate、Recall、MRR与nDCG\n主题：Hit与Recall\nHit@k只判断top-k是否至少出现一个相关结果；Recall@k衡量相关结果被覆盖的比例。多证据问题只看Hit可能掩盖关键证据缺失。\n适用边界：测试集需固定版本；标注需保留依据；发布报告必须包含分类型指标", "difficulty_level": 2, "source_ids": ["SRC-RAGAS-2023"], "citation_text": "评测、观测与持续改进 / 检索评测：Hit Rate、Recall、MRR与nDCG / Hit与Recall"}, {"chunk_id": "7ad72f87-9999-5750-984b-061b75ef4885", "evidence_id": "c3f82abd-e2ee-5035-9af9-47b1efad9b83", "title": "检索评测：Hit Rate、Recall、MRR与nDCG：MRR与nDCG", "content": "知识点：检索评测：Hit Rate、Recall、MRR与nDCG\n主题：MRR与nDCG\nMRR关注首个相关结果的倒数排名，适合单一主要证据；nDCG可处理多个结果和不同相关等级，更适合评估排序整体质量。\n适用边界：测试集需固定版本；标注需保留依据；发布报告必须包含分类型指标", "difficulty_level": 2, "source_ids": ["SRC-RAGAS-2023"], "citation_text": "评测、观测与持续改进 / 检索评测：Hit Rate、Recall、MRR与nDCG / MRR与nDCG"}, {"chunk_id": "eb13f71b-5528-5ee9-bd2c-79530a94fd4f", "evidence_id": "4664f323-58f4-55a0-8727-58b743ad4ea0", "title": "检索评测：Hit Rate、Recall、MRR与nDCG：分层分析", "content": "知识点：检索评测：Hit Rate、Recall、MRR与nDCG\n主题：分层分析\n总平均值之外应按定义、精确术语、比较、步骤、多跳、中文缩写和安全问题分组。系统可能总体达标但在某个关键类别严重失败。\n适用边界：测试集需固定版本；标注需保留依据；发布报告必须包含分类型指标", "difficulty_level": 2, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "评测、观测与持续改进 / 检索评测：Hit Rate、Recall、MRR与nDCG / 分层分析"}]}, {"id": "RAG-M06-N02", "module_id": "RAG-M06", "name": "生成评测：忠实度、引用、完整性与适配", "aliases": ["generation evaluation", "faithfulness", "citation correctness", "难度适配"], "difficulty": 3, "core": true, "importance": 1.0, "estimated_minutes": 90, "prerequisites": ["RAG-M05-N03", "RAG-M06-N01"], "objectives": ["分解答案为可验证专业陈述", "评估证据忠实度和引用支持关系", "测量学习者画像与资源难度适配"], "summary": "生成评测应判断答案是否被证据支持、是否覆盖任务要求、引用是否准确、表达是否适合目标学习者。一个答案可能事实正确但不完整，也可能难度错配。", "facts": [{"heading": "忠实度", "body": "把输出拆为原子专业陈述，逐项判断是否得到提供证据支持。忠实度关注“是否依据上下文”，不等同于世界知识上的绝对正确。", "source_ids": ["SRC-RAGAS-2023"]}, {"heading": "引用正确与完整", "body": "引用正确率衡量引用是否真正支持对应陈述；引用完整率衡量应引用的关键陈述是否都提供了来源。仅有很多引用不代表引用质量高。", "source_ids": ["SRC-RAGAS-2023"]}, {"heading": "答案完整与任务符合", "body": "资源需覆盖指定知识点、实操步骤和边界，且遵守输出格式。可用参考要点、Rubric和关键概念覆盖率进行检查。", "source_ids": ["SRC-COMPETITION-XH-202630"]}, {"heading": "难度适配", "body": "难度适配需要人工标注或规则基准：概念密度、前置知识、代码复杂度、任务开放度和提示程度应与画像一致。适配准确率不能只由生成模型自评。", "source_ids": ["SRC-COMPETITION-XH-202630", "SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "答案事实正确就代表适合学习者。", "correction": "资源还需要匹配目标、前置知识、表达形式和任务难度。"}, {"wrong": "LLM-as-a-judge分数可以直接当最终结论。", "correction": "自动评审需校准、抽检并与人工标注比较。"}], "boundaries": ["专业谬误率需人工或权威规则确认", "自动评审Prompt和模型要版本化", "适配评测必须覆盖多类画像"], "task": {"title": "建立三画像资源评测集", "description": "为同一批知识点生成初级、中级和进阶资源，人工标注忠实度、引用、覆盖和难度适配。", "deliverable": "评分Rubric、标注集与一致性分析", "rubric": ["至少三类画像", "至少30份资源", "报告标注者一致性", "自动评审经过校准"]}, "_module_name": "评测、观测与持续改进", "_chunks": [{"chunk_id": "e39d4fbd-9342-5c9b-ac1a-f250d4265a55", "evidence_id": "03235f85-f938-56aa-b0ff-4bc1532ba277", "title": "生成评测：忠实度、引用、完整性与适配：忠实度", "content": "知识点：生成评测：忠实度、引用、完整性与适配\n主题：忠实度\n把输出拆为原子专业陈述，逐项判断是否得到提供证据支持。忠实度关注“是否依据上下文”，不等同于世界知识上的绝对正确。\n适用边界：专业谬误率需人工或权威规则确认；自动评审Prompt和模型要版本化；适配评测必须覆盖多类画像", "difficulty_level": 3, "source_ids": ["SRC-RAGAS-2023"], "citation_text": "评测、观测与持续改进 / 生成评测：忠实度、引用、完整性与适配 / 忠实度"}, {"chunk_id": "925c9f04-1e38-5636-baa1-a772e44e7687", "evidence_id": "1d95d51a-ea33-537f-b172-a64a41a50afe", "title": "生成评测：忠实度、引用、完整性与适配：引用正确与完整", "content": "知识点：生成评测：忠实度、引用、完整性与适配\n主题：引用正确与完整\n引用正确率衡量引用是否真正支持对应陈述；引用完整率衡量应引用的关键陈述是否都提供了来源。仅有很多引用不代表引用质量高。\n适用边界：专业谬误率需人工或权威规则确认；自动评审Prompt和模型要版本化；适配评测必须覆盖多类画像", "difficulty_level": 3, "source_ids": ["SRC-RAGAS-2023"], "citation_text": "评测、观测与持续改进 / 生成评测：忠实度、引用、完整性与适配 / 引用正确与完整"}, {"chunk_id": "0f8b361f-7fc2-55eb-866d-2ed75fd09776", "evidence_id": "5df563d9-8637-503b-8c51-890b1420fda8", "title": "生成评测：忠实度、引用、完整性与适配：答案完整与任务符合", "content": "知识点：生成评测：忠实度、引用、完整性与适配\n主题：答案完整与任务符合\n资源需覆盖指定知识点、实操步骤和边界，且遵守输出格式。可用参考要点、Rubric和关键概念覆盖率进行检查。\n适用边界：专业谬误率需人工或权威规则确认；自动评审Prompt和模型要版本化；适配评测必须覆盖多类画像", "difficulty_level": 3, "source_ids": ["SRC-COMPETITION-XH-202630"], "citation_text": "评测、观测与持续改进 / 生成评测：忠实度、引用、完整性与适配 / 答案完整与任务符合"}, {"chunk_id": "24949152-3f96-5159-ac09-52fd294ebf07", "evidence_id": "6424993c-4943-51fa-963a-7e9abafc2354", "title": "生成评测：忠实度、引用、完整性与适配：难度适配", "content": "知识点：生成评测：忠实度、引用、完整性与适配\n主题：难度适配\n难度适配需要人工标注或规则基准：概念密度、前置知识、代码复杂度、任务开放度和提示程度应与画像一致。适配准确率不能只由生成模型自评。\n适用边界：专业谬误率需人工或权威规则确认；自动评审Prompt和模型要版本化；适配评测必须覆盖多类画像", "difficulty_level": 3, "source_ids": ["SRC-COMPETITION-XH-202630", "SRC-NIST-AI-RMF"], "citation_text": "评测、观测与持续改进 / 生成评测：忠实度、引用、完整性与适配 / 难度适配"}]}, {"id": "RAG-M06-N03", "module_id": "RAG-M06", "name": "端到端回归、消融实验与发布门禁", "aliases": ["RAG regression", "ablation study", "quality gate"], "difficulty": 3, "core": true, "importance": 1.0, "estimated_minutes": 90, "prerequisites": ["RAG-M06-N01", "RAG-M06-N02"], "objectives": ["建立版本级回归流程", "通过消融识别每个组件真实贡献", "定义阻断发布的质量门禁"], "summary": "RAG系统的改动可能改善一个指标同时损害另一个。每次知识、切片、嵌入、检索、重排、Prompt或模型变更，都应在固定数据集上回归并与基线比较。", "facts": [{"heading": "版本回归范围", "body": "回归对象包括知识覆盖、ID与引用完整性、检索指标、生成忠实度、拒答、安全、时延、成本和关键用户流程。结果绑定知识库、模型、Prompt和代码版本。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "消融实验", "body": "分别关闭混合检索、重排、上下文压缩、审核或个性化策略，比较指标变化，才能证明组件贡献。只展示最终系统得分无法说明创新来自哪里。", "source_ids": ["SRC-RAGAS-2023", "SRC-COMPETITION-XH-202630"]}, {"heading": "门禁与容差", "body": "门禁应包含绝对阈值和相对退化阈值，例如核心Hit@5不得低于目标且不得比当前生产版下降超过一定比例。阻断项失败不能由平均分抵消。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "失败案例资产化", "body": "每个线上或测试失败都转化为可复现案例，标注根因属于来源、解析、切片、检索、生成、审核还是权限。修复后加入长期回归集。", "source_ids": ["SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "新版本总体平均分更高就可以发布。", "correction": "关键类别、安全和阻断项的退化不能被平均值掩盖。"}, {"wrong": "消融实验只适合论文。", "correction": : "多个叶子命中同一父节点时应合并去重；父节点过大时可只取相关窗口。上下文打包仍需遵守token预算和权限过滤。", "source_ids": ["SRC-LOST-MIDDLE-2024"]}, {"heading": "适用边界", "body": "层级检索适合结构稳定的长文档。对独立FAQ、短事实或跨文档实体关系，普通混合检索或图检索可能更合适。", "source_ids": ["SRC-GRAPHRAG-OFFICIAL", "SRC-LLAMAINDEX-HIERARCHY"]}], "misconceptions": [{"wrong": "父子检索只是把chunk size设置成两个值。", "correction": "还需要持久化节点关系、回溯策略、合并去重和上下文预算。"}, {"wrong": "返回完整父章节一定更好。", "correction": "父章节可能过大并带入噪声，需要窗口化和评测。"}], "boundaries": ["父子关系必须可验证", "权限在父子回溯时仍生效", "长文档策略需与普通混合检索对比"], "task": {"title": "实现教材型文档父子检索", "description": "为一份多章节技术手册构建三级节点，比较叶子直返和父子回溯的检索与答案效果。", "deliverable": "索引、回溯器和消融报告", "rubric": ["三级关系正确", "合并去重可控", "比较上下文精度", "报告token与时延成本"]}, "_module_name": "高级RAG架构", "_chunks": [{"chunk_id": "f0742f62-c9f4-5f8a-999d-ec0dd6dad892", "evidence_id": "8a6d4207-0b73-570f-88a9-0a286da9db8d", "title": "父子检索、层级检索与长文档问答：层级节点", "content": "知识点：父子检索、层级检索与长文档问答\n主题：层级节点\n同一文档可以递归拆成章节、段落和句群等多层节点。节点列表虽然可平面存储，但必须保留PARENT、CHILD、PREVIOUS和NEXT关系。\n适用边界：父子关系必须可验证；权限在父子回溯时仍生效；长文档策略需与普通混合检索对比", "difficulty_level": 3, "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"], "citation_text": "高级RAG架构 / 父子检索、层级检索与长文档问答 / 层级节点"}, {"chunk_id": "5f4eccda-6f09-5765-a474-1fefb35f191c", "evidence_id": "8662dadf-3f31-5802-8bf9-9a4024d1fda3", "title": "父子检索、层级检索与长文档问答：小块检索大块返回", "content": "知识点：父子检索、层级检索与长文档问答\n主题：小块检索大块返回\n查询先匹配信息密度高的叶子节点，再按父关系补回必要章节。这样比直接检索大块更精确，也比只返回小块更完整。\n适用边界：父子关系必须可验证；权限在父子回溯时仍生效；长文档策略需与普通混合检索对比", "difficulty_level": 3, "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"], "citation_text": "高级RAG架构 / 父子检索、层级检索与长文档问答 / 小块检索大块返回"}, {"chunk_id": "5b4a9cf8-96f5-587c-b7ed-8d27c2f15d0b", "evidence_id": "5beb2f8c-4908-51ba-b2b5-8020e17bcf3c", "title": "父子检索、层级检索与长文档问答：合并与预算", "content": "知识点：父子检索、层级检索与长文档问答\n主题：合并与预算\n多个叶子命中同一父节点时应合并去重；父节点过大时可只取相关窗口。上下文打包仍需遵守token预算和权限过滤。\n适用边界：父子关系必须可验证；权限在父子回溯时仍生效；长文档策略需与普通混合检索对比", "difficulty_level": 3, "source_ids": ["SRC-LOST-MIDDLE-2024"], "citation_text": "高级RAG架构 / 父子检索、层级检索与长文档问答 / 合并与预算"}, {"chunk_id": "3ea339b4-3da0-57cf-833a-630a5812aac9", "evidence_id": "38a85343-ee96-5bb6-a36d-102b65702aee", "title": "父子检索、层级检索与长文档问答：适用边界", "content": "知识点：父子检索、层级检索与长文档问答\n主题：适用边界\n层级检索适合结构稳定的长文档。对独立FAQ、短事实或跨文档实体关系，普通混合检索或图检索可能更合适。\n适用边界：父子关系必须可验证；权限在父子回溯时仍生效；长文档策略需与普通混合检索对比", "difficulty_level": 3, "source_ids": ["SRC-GRAPHRAG-OFFICIAL", "SRC-LLAMAINDEX-HIERARCHY"], "citation_text": "高级RAG架构 / 父子检索、层级检索与长文档问答 / 适用边界"}]}, {"id": "RAG-M07-N02", "module_id": "RAG-M07", "name": "GraphRAG、实体关系与局部/全局查询", "aliases": ["GraphRAG", "knowledge graph RAG", "图检索"], "difficulty": 4, "core": false, "importance": 0.9, "estimated_minutes": 120, "prerequisites": ["RAG-M02-N04", "RAG-M06-N01"], "objectives": ["判断何时需要图结构而不是纯文本相似度", "区分局部实体查询与全局主题查询", "理解图构建成本和证据回溯要求"], "summary": "GraphRAG把实体、关系和社区结构用于检索，适合多跳关系、依赖链和整体主题问题。它不是普通问答的默认方案，图抽取错误和构建成本必须通过评测证明值得。", "facts": [{"heading": "图结构价值", "body": "文本相似度难以直接回答“谁依赖谁”“某故障经过哪些环节传播”等关系问题。图结构显式保存实体和关系，可执行邻域、路径或社区级查询。", "source_ids": ["SRC-GRAPHRAG-OFFICIAL"]}, {"heading": "Local Search", "body": "局部查询把与特定实体相关的图数据和原文切片组合，适合围绕具体实体、关系和邻域的问题，并保留到原始文本的证据链。", "source_ids": ["SRC-GRAPHRAG-OFFICIAL"]}, {"heading": "Global Search", "body": "全局查询基于社区报告等摘要理解整个数据集的主要主题，通常资源消耗更高，适合“总体有哪些主要风险或趋势”等整体性问题。", "source_ids": ["SRC-GRAPHRAG-OFFICIAL"]}, {"heading": "图质量与边界", "body": "实体归一化、关系方向、时间范围和来源必须可追溯。图抽取错误会被路径查询放大，因此需要抽样审核、冲突处理和与普通混合检索的消融比较。", "source_ids": ["SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "GraphRAG在所有问题上都比向量检索强。", "correction": "单点事实和普通语义问答通常不需要承担图构建与查询成本。"}, {"wrong": "模型抽取出的关系可以直接当事实。", "correction": "关系是派生知识，必须绑定原文证据并通过审核。"}], "boundaries": ["图边必须有来源证据", "全局查询必须设置成本上限", "图策略上线前需证明相对基线收益"], "task": {"title": "构建RAG知识点依赖图并实现两类查询", "description": "把本Domain Pack的前置关系和对比关系构图，实现Local实体查询与Global模块摘要，并与混合检索比较。", "deliverable": "图数据、查询器和评测报告", "rubric": ["关系可追溯", "Local/Global边界正确", "包含错误关系抽检", "有成本和质量消融"]}, "_module_name": "高级RAG架构", "_chunks": [{"chunk_id": "be0259e4-7475-5cf3-8992-44bf31fc3194", "evidence_id": "98506802-b517-54d1-830d-4593bd3abca6", "title": "GraphRAG、实体关系与局部/全局查询：图结构价值", "content": "知识点：GraphRAG、实体关系与局部/全局查询\n主题：图结构价值\n文本相似度难以直接回答“谁依赖谁”“某故障经过哪些环节传播”等关系问题。图结构显式保存实体和关系，可执行邻域、路径或社区级查询。\n适用边界：图边必须有来源证据；全局查询必须设置成本上限；图策略上线前需证明相对基线收益", "difficulty_level": 4, "source_ids": ["SRC-GRAPHRAG-OFFICIAL"], "citation_text": "高级RAG架构 / GraphRAG、实体关系与局部/全局查询 / 图结构价值"}, {"chunk_id": "23155317-ab77-509f-8d05-1827f6913a0d", "evidence_id": "52ab22c2-b150-504d-a10c-3c4d2f8bf0e5", "title": "GraphRAG、实体关系与局部/全局查询：Local Search", "content": "知识点：GraphRAG、实体关系与局部/全局查询\n主题：Local Search\n局部查询把与特定实体相关的图数据和原文切片组合，适合围绕具体实体、关系和邻域的问题，并保留到原始文本的证据链。\n适用边界：图边必须有来源证据；全局查询必须设置成本上限；图策略上线前需证明相对基线收益", "difficulty_level": 4, "source_ids": ["SRC-GRAPHRAG-OFFICIAL"], "citation_text": "高级RAG架构 / GraphRAG、实体关系与局部/全局查询 / Local Search"}, {"chunk_id": "23b37e15-2774-5655-87f7-40d8b02fe464", "evidence_id": "2d40b0bf-895a-5c32-8073-ecf7ecf35403", "title": "GraphRAG、实体关系与局部/全局查询：Global Search", "content": "知识点：GraphRAG、实体关系与局部/全局查询\n主题：Global Search\n全局查询基于社区报告等摘要理解整个数据集的主要主题，通常资源消耗更高，适合“总体有哪些主要风险或趋势”等整体性问题。\n适用边界：图边必须有来源证据；全局查询必须设置成本上限；图策略上线前需证明相对基线收益", "difficulty_level": 4, "source_ids": ["SRC-GRAPHRAG-OFFICIAL"], "citation_text": "高级RAG架构 / GraphRAG、实体关系与局部/全局查询 / Global Search"}, {"chunk_id": "4f834270-c628-5538-b5be-6e105c569db4", "evidence_id": "34ab589e-3895-5dda-af1f-7ba8ebf76721", "title": "GraphRAG、实体关系与局部/全局查询：图质量与边界", "content": "知识点：GraphRAG、实体关系与局部/全局查询\n主题：图质量与边界\n实体归一化、关系方向、时间范围和来源必须可追溯。图抽取错误会被路径查询放大，因此需要抽样审核、冲突处理和与普通混合检索的消融比较。\n适用边界：图边必须有来源证据；全局查询必须设置成本上限；图策略上线前需证明相对基线收益", "difficulty_level": 4, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "高级RAG架构 / GraphRAG、实体关系与局部/全局查询 / 图质量与边界"}]}, {"id": "RAG-M07-N03", "module_id": "RAG-M07", "name": "Agentic RAG、问题分解与检索自修复", "aliases": ["Agentic RAG", "adaptive retrieval", "multi-step retrieval"], "difficulty": 4, "core": false, "importance": 0.9, "estimated_minutes": 120, "prerequisites": ["RAG-M04-N01", "RAG-M05-N02", "RAG-M06-N04"], "objectives": ["让Agent根据问题选择检索工具和步骤", "设计证据充分性检查与重试上限", "避免无限循环和不可解释的自主行为"], "summary": "Agentic RAG把固定检索流水线扩展为受策略约束的计划-执行-检查循环。它适合复杂、多跳或证据不足的问题，普通事实问题仍应走低成本确定性路径。", "facts": [{"heading": "计划与工具选择", "body": "Agent先识别子问题和证据类型，再从混合检索、层级检索、图查询、结构化查询或代码检索中选择工具。工具目录和权限由系统固定，不能由模型自行创造。", "source_ids": ["SRC-GRAPHRAG-OFFICIAL", "SRC-NIST-AI-RMF"]}, {"heading": "证据检查循环", "body": "每次检索后检查关键子问题是否有足够、可信且不冲突的证据。若不足，可改写查询或切换工具；达到最大步数仍不足则拒答或转人工。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "确定性边界", "body": "状态机应规定允许的节点、边、重试次数、超时和预算。Agent提供计划建议，Runtime验证后执行，避免模型直接控制数据库和高权限工具。", "source_ids": ["SRC-OWASP-PROMPT-INJECTION", "SRC-NIST-AI-RMF"]}, {"heading": "评测与回放", "body": "除答案质量外，还要评测平均工具调用数、无效循环率、计划成功率、恢复率、成本和可回放性，并与固定流水线比较。", "source_ids": ["SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "Agentic RAG就是让模型自由决定所有步骤。", "correction": "生产系统需要工具白名单、状态机、预算、Schema和后端授权。"}, {"wrong": "所有问题都应该走多步Agent。", "correction": "简单查询使用固定路径更快、更便宜、更稳定。"}], "boundaries": ["工具与状态边由代码控制", "循环有硬上限", "高风险工具必须人工确认"], "task": {"title": "实现受控多步检索工作流", "description": "为一个包含三个子问题的故障分析任务设计计划、工具选择、证据检查、一次自修复和最终拒答路径。", "deliverable": "工作流定义、事件日志和消融报告", "rubric": ["步骤有硬边界", "证据检查可解释", "无无限循环", "与固定流程比较质量成本"]}, "_module_name": "高级RAG架构", "_chunks": [{"chunk_id": "5268db10-a507-532c-86b6-5c2b2ccf2950", "evidence_id": "48d5743b-bdaa-59ed-9b3c-6afd2a6a238d", "title": "Agentic RAG、问题分解与检索自修复：计划与工具选择", "content": "知识点：Agentic RAG、问题分解与检索自修复\n主题：计划与工具选择\nAgent先识别子问题和证据类型，再从混合检索、层级检索、图查询、结构化查询或代码检索中选择工具。工具目录和权限由系统固定，不能由模型自行创造。\n适用边界：工具与状态边由代码控制；循环有硬上限；高风险工具必须人工确认", "difficulty_level": 4, "source_ids": ["SRC-GRAPHRAG-OFFICIAL", "SRC-NIST-AI-RMF"], "citation_text": "高级RAG架构 / Agentic RAG、问题分解与检索自修复 / 计划与工具选择"}, {"chunk_id": "ba8bd2af-5dd6-56b1-a26b-2c3120ae5807", "evidence_id": "9122166e-62a5-5f90-aa9f-6b701a509ac9", "title": "Agentic RAG、问题分解与检索自修复：证据检查循环", "content": "知识点：Agentic RAG、问题分解与检索自修复\n主题：证据检查循环\n每次检索后检查关键子问题是否有足够、可信且不冲突的证据。若不足，可改写查询或切换工具；达到最大步数仍不足则拒答或转人工。\n适用边界：工具与状态边由代码控制；循环有硬上限；高风险工具必须人工确认", "difficulty_level": 4, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "高级RAG架构 / Agentic RAG、问题分解与检索自修复 / 证据检查循环"}, {"chunk_id": "15c79bdf-c5cb-59eb-8486-a1ad5e961848", "evidence_id": "a06b3a62-37a7-5230-9a9a-f0ca5d15f1e9", "title": "Agentic RAG、问题分解与检索自修复：确定性边界", "content": "知识点：Agentic RAG、问题分解与检索自修复\n主题：确定性边界\n状态机应规定允许的节点、边、重试次数、超时和预算。Agent提供计划建议，Runtime验证后执行，避免模型直接控制数据库和高权限工具。\n适用边界：工具与状态边由代码控制；循环有硬上限；高风险工具必须人工确认", "difficulty_level": 4, "source_ids": ["SRC-OWASP-PROMPT-INJECTION", "SRC-NIST-AI-RMF"], "citation_text": "高级RAG架构 / Agentic RAG、问题分解与检索自修复 / 确定性边界"}, {"chunk_id": "6a301e99-ed65-518b-970b-52f425e4b19b", "evidence_id": "6c831bf7-0966-5b49-bcb0-319c51feb9fa", "title": "Agentic RAG、问题分解与检索自修复：评测与回放", "content": "知识点：Agentic RAG、问题分解与检索自修复\n主题：评测与回放\n除答案质量外，还要评测平均工具调用数、无效循环率、计划成功率、恢复率、成本和可回放性，并与固定流水线比较。\n适用边界：工具与状态边由代码控制；循环有硬上限；高风险工具必须人工确认", "difficulty_level": 4, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "高级RAG架构 / Agentic RAG、问题分解与检索自修复 / 评测与回放"}]}, {"id": "RAG-M07-N04", "module_id": "RAG-M07", "name": "结构化、代码与多模态知识路由", "aliases": ["structured RAG", "code RAG", "multimodal RAG", "知识类型路由"], "difficulty": 5, "core": false, "importance": 0.85, "estimated_minutes": 120, "prerequisites": ["RAG-M01-N04", "RAG-M07-N03"], "objectives": ["按知识类型选择结构化查询、符号检索或多模态索引", "组合多种证据并保留来源", "设计路由错误的降级策略"], "summary": "不是所有知识都应转成普通文本向量。表格和实时指标应结构化查询，代码应保留符号与调用关系，图片和流程图需要视觉或说明索引，再由检索计划组合证据。", "facts": [{"heading": "结构化知识", "body": "固定字段、规则清单、指标和关系表优先使用SQL或受控查询，避免模型从文本化表格猜测数值。查询结果需携带表、字段、时间和过滤条件。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "代码知识", "body": "代码检索应按仓库、文件、符号、签名、注释和调用关系建立索引。只按固定字符切片可能把函数和依赖拆散，降低解释和修复质量。", "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"]}, {"heading": "多模态知识", "body": "架构图、流程图和截图可保存原始资产、OCR文本、人工说明和对象位置。生成器引用视觉证据时应给出图号或区域，不能只引用自动描述。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "路由与融合", "body": "Knowledge Profile描述内容结构，Query Router根据问题选择一个或多个工具，Evidence Merger统一成证据对象。路由不确定时可并行低成本检索或回退到人工配置。", "source_ids": ["SRC-GRAPHRAG-OFFICIAL", "SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "把表格、代码和图片转成文本就完全等价。", "correction": "转换可能丢失结构、位置、类型和精确数值，需要保留原始模态。"}, {"wrong": "自动路由模型的选择不需要测试。", "correction": "路由错误会让正确知识无法召回，应建立知识类型与问题类型黄金集。"}], "boundaries": ["精确数值优先结构化查询", "代码保留符号关系", "视觉证据保留原始资产引用"], "task": {"title": "设计多知识类型检索路由器", "description": "为文本规范、指标表、Python仓库和流程图四类知识建立Profile、查询计划和统一证据格式。", "deliverable": "路由策略、适配器接口和30条测试集", "rubric": ["四类知识各有专用路径", "统一证据可追溯", "路由准确率可测", "有不确定性回退"]}, "_module_name": "高级RAG架构", "_chunks": [{"chunk_id": "1fe1900b-4b76-56c2-891c-347e3b495543", "evidence_id": "62932873-51ea-5a17-86b5-b386af4b4671", "title": "结构化、代码与多模态知识路由：结构化知识", "content": "知识点：结构化、代码与多模态知识路由\n主题：结构化知识\n固定字段、规则清单、指标和关系表优先使用SQL或受控查询，避免模型从文本化表格猜测数值。查询结果需携带表、字段、时间和过滤条件。\n适用边界：精确数值优先结构化查询；代码保留符号关系；视觉证据保留原始资产引用", "difficulty_level": 5, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "高级RAG架构 / 结构化、代码与多模态知识路由 / 结构化知识"}, {"chunk_id": "44908675-1ad6-5693-8383-4957f92d648d", "evidence_id": "cc8a5bcb-a904-508d-becf-7c11bae4e059", "title": "结构化、代码与多模态知识路由：代码知识", "content": "知识点：结构化、代码与多模态知识路由\n主题：代码知识\n代码检索应按仓库、文件、符号、签名、注释和调用关系建立索引。只按固定字符切片可能把函数和依赖拆散，降低解释和修复质量。\n适用边界：精确数值优先结构化查询；代码保留符号关系；视觉证据保留原始资产引用", "difficulty_level": 5, "source_ids": ["SRC-LLAMAINDEX-HIERARCHY"], "citation_text": "高级RAG架构 / 结构化、代码与多模态知识路由 / 代码知识"}, {"chunk_id": "eae33691-5fc7-5449-951f-8d71e2bc8c04", "evidence_id": "08c393ce-e227-59c9-b152-c945db8c3b40", "title": "结构化、代码与多模态知识路由：多模态知识", "content": "知识点：结构化、代码与多模态知识路由\n主题：多模态知识\n架构图、流程图和截图可保存原始资产、OCR文本、人工说明和对象位置。生成器引用视觉证据时应给出图号或区域，不能只引用自动描述。\n适用边界：精确数值优先结构化查询；代码保留符号关系；视觉证据保留原始资产引用", "difficulty_level": 5, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "高级RAG架构 / 结构化、代码与多模态知识路由 / 多模态知识"}, {"chunk_id": "fe812090-925c-510c-b367-4e0ea880a568", "evidence_id": "597a13ad-5a95-5959-953b-1121d00ba127", "title": "结构化、代码与多模态知识路由：路由与融合", "content": "知识点：结构化、代码与多模态知识路由\n主题：路由与融合\nKnowledge Profile描述内容结构，Query Router根据问题选择一个或多个工具，Evidence Merger统一成证据对象。路由不确定时可并行低成本检索或回退到人工配置。\n适用边界：精确数值优先结构化查询；代码保留符号关系；视觉证据保留原始资产引用", "difficulty_level": 5, "source_ids": ["SRC-GRAPHRAG-OFFICIAL", "SRC-NIST-AI-RMF"], "citation_text": "高级RAG架构 / 结构化、代码与多模态知识路由 / 路由与融合"}]}, {"id": "RAG-M08-N01", "module_id": "RAG-M08", "name": "知识服务API、契约与Agent集成", "aliases": ["knowledge API", "retrieval service", "Agent interface"], "difficulty": 2, "core": true, "importance": 1.0, "estimated_minutes": 90, "prerequisites": ["RAG-M01-N02", "RAG-M02-N04"], "objectives": ["定义检索请求、响应和证据对象", "使用OpenAPI与JSON Schema冻结边界", "实现版本、幂等、错误码和兼容性策略"], "summary": "知识库应作为可替换服务或模块向后端和Agent提供稳定契约。调用者传入知识版本、查询、top-k和不可覆盖的过滤条件，返回结构化证据而不是自由文本答案。", "facts": [{"heading": "检索请求", "body": "请求至少包含retrieval_request_id、knowledge_base_version_id、query_text、top_k和filters。身份与权限过滤由后端生成，Agent不能通过自然语言绕过。", "source_ids": ["SRC-OPENAPI-31", "SRC-NIST-AI-RMF"]}, {"heading": "证据响应", "body": "每个证据对象至少包含evidence_id、chunk_id、document_id、content_excerpt和relevance_score；扩展字段可包含知识节点、来源、位置、排名路径和引用文本。", "source_ids": ["SRC-OPENAPI-31", "SRC-COMPETITION-XH-202630"]}, {"heading": "契约优先", "body": "OpenAPI定义HTTP边界，JSON Schema定义Agent模块输入输出，字段字典统一语义。前端、后端和Agent通过生成类型和契约测试并行开发，而不是靠口头约定。", "source_ids": ["SRC-OPENAPI-31"]}, {"heading": "兼容与变更", "body": "新增可选字段通常可向后兼容，删除、重命名、改变类型或枚举需要版本升级和迁移期。接口变更必须说明所有者、影响模块、Mock和回滚方案。", "source_ids": ["SRC-OPENAPI-31", "SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "Agent之间直接传任意JSON更灵活。", "correction": "无契约会导致字段漂移、无法并行开发和难以测试。"}, {"wrong": "检索API应该直接返回最终答案。", "correction": "知识服务返回证据，资源生成和审核由各自Agent完成。"}], "boundaries": ["浏览器不得直接访问内部检索服务", "所有输出先过Schema", "破坏性变更需要显式版本"], "task": {"title": "实现与现有项目兼容的知识检索服务", "description": "按照冻结的retrieval_request/response Schema实现HTTP与Python模块接口，提供Mock、错误码和契约测试。", "deliverable": "OpenAPI、服务、SDK和测试", "rubric": ["现有Schema100%通过", "支持版本和过滤", "错误响应稳定", "调用样例可直接运行"]}, "_module_name": "API、性能与生产部署", "_chunks": [{"chunk_id": "4781a8a6-c753-5eb7-bad1-638d07aa23a9", "evidence_id": "a7da9668-9a0f-5eb3-8d65-1e2f8a3f2cfb", "title": "知识服务API、契约与Agent集成：检索请求", "content": "知识点：知识服务API、契约与Agent集成\n主题：检索请求\n请求至少包含retrieval_request_id、knowledge_base_version_id、query_text、top_k和filters。身份与权限过滤由后端生成，Agent不能通过自然语言绕过。\n适用边界：浏览器不得直接访问内部检索服务；所有输出先过Schema；破坏性变更需要显式版本", "difficulty_level": 2, "source_ids": ["SRC-OPENAPI-31", "SRC-NIST-AI-RMF"], "citation_text": "API、性能与生产部署 / 知识服务API、契约与Agent集成 / 检索请求"}, {"chunk_id": "2d2dc7d4-b6fe-52c9-a387-472505493a67", "evidence_id": "a9903154-d349-5bb0-84f1-96c0c210e11e", "title": "知识服务API、契约与Agent集成：证据响应", "content": "知识点：知识服务API、契约与Agent集成\n主题：证据响应\n每个证据对象至少包含evidence_id、chunk_id、document_id、content_excerpt和relevance_score；扩展字段可包含知识节点、来源、位置、排名路径和引用文本。\n适用边界：浏览器不得直接访问内部检索服务；所有输出先过Schema；破坏性变更需要显式版本", "difficulty_level": 2, "source_ids": ["SRC-OPENAPI-31", "SRC-COMPETITION-XH-202630"], "citation_text": "API、性能与生产部署 / 知识服务API、契约与Agent集成 / 证据响应"}, {"chunk_id": "3081e3ba-c78f-5597-8ac1-3eca5e5f1bcd", "evidence_id": "e706b43c-21c6-5e1e-be27-a6d15bf6dca6", "title": "知识服务API、契约与Agent集成：契约优先", "content": "知识点：知识服务API、契约与Agent集成\n主题：契约优先\nOpenAPI定义HTTP边界，JSON Schema定义Agent模块输入输出，字段字典统一语义。前端、后端和Agent通过生成类型和契约测试并行开发，而不是靠口头约定。\n适用边界：浏览器不得直接访问内部检索服务；所有输出先过Schema；破坏性变更需要显式版本", "difficulty_level": 2, "source_ids": ["SRC-OPENAPI-31"], "citation_text": "API、性能与生产部署 / 知识服务API、契约与Agent集成 / 契约优先"}, {"chunk_id": "41eba607-2856-52a2-9366-9493305ecf11", "evidence_id": "a089978b-f264-5e1f-8ec5-299595c46819", "title": "知识服务API、契约与Agent集成：兼容与变更", "content": "知识点：知识服务API、契约与Agent集成\n主题：兼容与变更\n新增可选字段通常可向后兼容，删除、重命名、改变类型或枚举需要版本升级和迁移期。接口变更必须说明所有者、影响模块、Mock和回滚方案。\n适用边界：浏览器不得直接访问内部检索服务；所有输出先过Schema；破坏性变更需要显式版本", "difficulty_level": 2, "source_ids": ["SRC-OPENAPI-31", "SRC-NIST-AI-RMF"], "citation_text": "API、性能与生产部署 / 知识服务API、契约与Agent集成 / 兼容与变更"}]}, {"id": "RAG-M08-N02", "module_id": "RAG-M08", "name": "持久化、事务、缓存与一致性", "aliases": ["RAG persistence", "database consistency", "cache invalidation"], "difficulty": 3, "core": true, "importance": 0.95, "estimated_minutes": 90, "prerequisites": ["RAG-M02-N04", "RAG-M08-N01"], "objectives": ["把权威业务数据、知识元数据、文件和缓存分层存储", "控制版本发布与激活事务", "设计缓存键和失效策略"], "summary": "PostgreSQL保存权威元数据、画像、证据和事件；对象存储保存原始大文件；Redis用于 d", "evidence_id": "83d3d7ce-7589-50b3-ae42-99e860593e20", "title": "持久化、事务、缓存与一致性：缓存键", "content": "知识点：持久化、事务、缓存与一致性\n主题：缓存键\n检索缓存必须包含知识版本、规范化查询、权限过滤、策略和参数。缺少版本或权限会返回过期或越权结果。发布新版本后可自然使用新键并逐步清理旧缓存。\n适用边界：客户端不持有数据库凭据；缓存必须可重建；激活版本切换需要事务与审计", "difficulty_level": 3, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "API、性能与生产部署 / 持久化、事务、缓存与一致性 / 缓存键"}, {"chunk_id": "90c14f77-5b44-55f0-be1b-f1a032df687b", "evidence_id": "e5980c5c-382b-51b1-a425-0f896e0d688e", "title": "持久化、事务、缓存与一致性：事件一致性", "content": "知识点：持久化、事务、缓存与一致性\n主题：事件一致性\n工作流状态和关键事件应持久化，Redis消息不能作为唯一真相。可使用事务外盒或幂等消费确保数据库状态与异步任务之间最终一致。\n适用边界：客户端不持有数据库凭据；缓存必须可重建；激活版本切换需要事务与审计", "difficulty_level": 3, "source_ids": ["SRC-NIST-AI-RMF"], "citation_text": "API、性能与生产部署 / 持久化、事务、缓存与一致性 / 事件一致性"}]}, {"id": "RAG-M08-N03", "module_id": "RAG-M08", "name": "性能、批处理、缓存与容量规划", "aliases": ["RAG performance", "latency optimization", "capacity planning"], "difficulty": 4, "core": false, "importance": 0.85, "estimated_minutes": 105, "prerequisites": ["RAG-M03-N02", "RAG-M06-N04", "RAG-M08-N02"], "objectives": ["建立容量模型与负载测试", "优化嵌入、检索、重排和模型调用", "设计超时、降级与背压"], "summary": "性能优化必须建立在质量门禁之上。通过批量嵌入、索引调优、缓存、并行召回和分层模型降低成本，同时监测召回退化和长尾时延。", "facts": [{"heading": "容量变量", "body": "容量模型至少考虑文档数、切片数、向量维度、索引大小、每日更新量、并发查询、候选池、重排调用和生成token。数据规模与查询模式共同决定瓶颈。", "source_ids": ["SRC-PGVECTOR-OFFICIAL"]}, {"heading": "批处理与索引", "body": "初次导入可批量生成嵌入并使用COPY加载，初始数据完成后再建近似索引通常更高效。增量更新需控制索引维护和版本一致性。", "source_ids": ["SRC-PGVECTOR-OFFICIAL"]}, {"heading": "并行与缓存", "body": "关键词和向量召回可并行，重复查询可缓存检索结果，稳定文档可缓存嵌入。缓存命中不能绕过权限和版本；并行任务需设置总超时。", "source_ids": ["SRC-NIST-AI-RMF"]}, {"heading": "降级策略", "body": "重排超时可退回混合排名，生成模型不可用可返回已审核静态资源，向量路径失败可退回关键词检索。每种降级都应标记质量等级并记录事件。", "source_ids": ["SRC-NIST-AI-RMF"]}], "misconceptions": [{"wrong": "减少top-k一定能同时提高速度和质量。", "correction": "速度可能提高，但关键证据召回可能下降，需要质量-性能联合评测。"}, {"wrong": "缓存越多越好。", "correction": "缓存键、权限、版本、失效和隐私成本必须一起考虑。"}], "boundaries": ["性能优化不得突破质量下限", "所有外部调用有超时", "系统必须有背压和降级"], "task": {"title": "完成100并发知识检索容量测试", "d const DB=JSON.parse(document.getElementById('data').textContent);const $=s=>document.querySelector(s);let selected='';
$('#domainTitle').textContent=DB.domain.name_zh;$('#domainGoal').textContent=DB.domain.training_goal;
const chunkCount=DB.nodes.reduce((a,n)=>a+n._chunks.length,0);const coreCount=DB.nodes.filter(n=>n.core).length;
$('#stats').innerHTML=[[DB.modules.length,'模块'],[DB.nodes.length,'知识节点'],[coreCount,'核心节点'],[chunkCount,'专业切片']].map(x=>`<div class="card"><div class="num">${x[0]}</div><div class="label">${x[1]}</div></div>`).join('');
DB.modules.forEach(m=>$('#module').insertAdjacentHTML('beforeend',`<option value="${m.module_id}">${m.module_id} ${m.name}</option>`));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hay(n){return [n.id,n.name,n.summary,n._module_name,...n.aliases,...n.objectives,...n.boundaries,...n.misconceptions.flatMap(m=>[m.wrong,m.correction]),...n._chunks.flatMap(c=>[c.title,c.content])].join(' ').toLowerCase()}
function filtered(){const q=$('#q').value.trim().toLowerCase(),m=$('#module').value,d=$('#difficulty').value;return DB.nodes.filter(n=>(!q||hay(n).includes(q))&&(!m||n.module_id===m)&&(!d||String(n.difficulty)===d))}
function render(){const rows=filtered();$('#resultTitle').textContent=`知识节点（${rows.length}）`;$('#list').innerHTML=rows.length?rows.map(n=>`<div class="item ${selected===n.id?'active':''}" data-id="${n.id}"><div class="title">${esc(n.id)} · ${esc(n.name)}</div><div class="meta"><span class="badge">${esc(n._module_name)}</span><span class="badge">L${n.difficulty}</span>${n.core?'<span class="badge core">核心</span>':''}<span class="badge">${n._chunks.length} 切片</span></div></div>`).join(''):'<div class="empty">没有匹配结果。</div>';document.querySelectorAll('.item').forEach(el=>el.onclick=()=>show(el.dataset.id))}
function li(xs){return '<ul>'+xs.map(x=>`<li>${esc(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')+'</ul>'}
function show(id){selected=id;const n=DB.nodes.find(x=>x.id===id);if(!n)return;render();$('#detail').innerHTML=`<h2>${esc(n.name)}</h2><div class="meta"><span class="badge">${esc(n.id)}</span><span class="badge">${esc(n._module_name)}</span><span class="badge">L${n.difficulty}</span>${n.core?'<span class="badge core">核心知识</span>':''}</div><p class="callout">${esc(n.summary)}</p><h3>学习目标</h3>${li(n.objectives)}<h3>前置知识</h3>${n.prerequisites.length?li(n.prerequisites):'<p>无强制前置知识。</p>'}<h3>常见误区与纠正</h3>${n.misconceptions.map(m=>`<div class="chunk"><b>误区：</b>${esc(m.wrong)}<br><b>纠正：</b>${esc(m.correction)}</div>`).join('')}<h3>适用边界</h3>${li(n.boundaries)}<h3>证据切片</h3>${n._chunks.map(c=>`<article class="chunk"><b>${esc(c.title)}</b><p>${esc(c.content).replace(/\n/g,'<br>')}</p><small>evidence_id: ${esc(c.evidence_id)} · chunk_id: ${esc(c.chunk_id)}</small><div class="source">source_ids: ${esc(c.source_ids.join(', '))}</div></article>`).join('')}`}
['q','module','difficulty'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));$('#reset').onclick=()=>{$('#q').value='';$('#module').value='';$('#difficulty').value='';selected='';render();$('#detail').innerHTML='<div class="empty">选择左侧知识节点查看完整内容、误区、边界和证据切片。</div>'};render();
</script></body></html>
