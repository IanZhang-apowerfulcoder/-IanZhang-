components:
  schemas:
    ApiError:
      type: object
      required:
      - error_code
      - message
      - request_id
      properties:
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    WorkflowCreateRequest:
      type: object
      required:
      - session_id
      - workflow_key
      - initial_state
      - idempotency_key
      properties:
        session_id:
          type: string
          format: uuid
        workflow_key:
          type: string
        initial_state:
          type: object
        idempotency_key:
          type: string
    WorkflowRun:
      type: object
      required:
      - workflow_run_id
      - status
      - current_state
      properties:
        workflow_run_id:
          type: string
          format: uuid
        status:
          type: string
        current_state:
          type: string
        session_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
    AgentInvokeRequest:
      type: object
      required:
      - agent_name
      - input_payload
      - schema_version
      properties:
        agent_name:
          type: string
        input_payload:
          type: object
        schema_version:
          type: string
        timeout_ms:
          type: integer
        idempotency_key:
          type: string
    AgentInvokeResult:
      type: object
      required:
      - agent_run_id
      - status
      - output_payload
      properties:
        agent_run_id:
          type: string
          format: uuid
        status:
          type: string
        output_payload:
          type: object
        warnings:
          type: array
          items:
            type: string
    RetrievalPlanRequest:
      type: object
      required:
      - router_input
      properties:
        router_input:
          type: object
    RetrievalPlanResult:
      type: object
      required:
      - retrieval_plan
      properties:
        retrieval_plan:
          type: object
    RetrievalRunRequest:
      type: object
      required:
      - retrieval_plan
      - idempotency_key
      properties:
        retrieval_plan:
          type: object
        idempotency_key:
          type: string
    RetrievalRunResult:
      type: object
      required:
      - retrieval_run_id
      - status
      properties:
        retrieval_run_id:
          type: string
          format: uuid
        status:
          type: string
        evidence_bundle:
          type:
          - object
          - 'null'
        sufficiency:
          type:
          - object
          - 'null'
    EvidenceFuseRequest:
      type: object
      required:
      - strategy_results
      - top_k
      properties:
        strategy_results:
          type: array
          items:
            type: object
        top_k:
          type: integer
    EvidenceBundle:
      type: object
    EventAppendRequest:
      type: object
      required:
      - event
      properties:
        event:
          type: object
    GenericResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data: {}
        request_id:
          type: string
