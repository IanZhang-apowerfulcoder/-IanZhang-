openapi: 3.1.0
info:
  title: Enterprise RAG Engineering Domain Pack API
  version: 1.0.0
  description: >-
    可独立运行并与现有项目检索契约兼容的知识库服务。兼容端点只返回冻结字段；扩展端点返回策略与元数据。
servers:
  - url: http://127.0.0.1:8090
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
  /api/v1/domain:
    get:
      operationId: get_domain
      responses:
        '200':
          description: Domain metadata
          content:
            application/json:
              schema:
                $ref: '../knowledge-bases/enterprise-rag-engineering-v1/contracts/jsonschema/domain.schema.json'
  /api/v1/knowledge/nodes:
    get:
      operationId: list_knowledge_nodes
      parameters:
        - in: query
          name: module_id
          schema: {type: string}
        - in: query
          name: core_only
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Knowledge nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../knowledge-bases/enterprise-rag-engineering-v1/contracts/jsonschema/knowledge_node.schema.json'
  /api/v1/knowledge/nodes/{knowledge_node_id}:
    get:
      operationId: get_knowledge_node
      parameters:
        - in: path
          name: knowledge_node_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Knowledge node
          content:
            application/json:
              schema:
                $ref: '../knowledge-bases/enterprise-rag-engineering-v1/contracts/jsonschema/knowledge_node.schema.json'
        '404': {description: Not found}
  /api/v1/retrieval/search:
    post:
      operationId: compatible_retrieval_search
      description: 与现有V6 retrieval request/response JSON Schema完全兼容。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../knowledge-bases/enterprise-rag-engineering-v1/contracts/jsonschema/retrieval_request.schema.json'
      responses:
        '200':
          description: Evidence items
          content:
            application/json:
              schema:
                $ref: '../knowledge-bases/enterprise-rag-engineering-v1/contracts/jsonschema/retrieval_response.schema.json'
        '400': {description: Invalid request or version}
  /api/v1/retrieval/search:extended:
    post:
      operationId: extended_retrieval_search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../knowledge-bases/enterprise-rag-engineering-v1/contracts/jsonschema/retrieval_request.schema.json'
      responses:
        '200':
          description: Extended evidence response
          content:
            application/json:
              schema:
                $ref: '../knowledge-bases/enterprise-rag-engineering-v1/contracts/jsonschema/extended_retrieval_response.schema.json'
  /api/v1/evidence/{evidence_id}:
    get:
      operationId: get_evidence
      parameters:
        - in: path
          name: evidence_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Evidence item
          content:
            application/json:
              schema:
                type: object
        '404': {description: Not found}
  /api/v1/questions:
    get:
      operationId: list_questions
      parameters:
        - in: query
          name: knowledge_node_id
          schema: {type: string}
        - in: query
          name: difficulty_level
          schema: {type: integer, minimum: 1, maximum: 5}
      responses:
        '200':
          description: Question bank
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../knowledge-bases/enterprise-rag-engineering-v1/contracts/jsonschema/question.schema.json'
  /api/v1/tasks:
    get:
      operationId: list_tasks
      parameters:
        - in: query
          name: knowledge_node_id
          schema: {type: string}
      responses:
        '200':
          description: Practice tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../knowledge-bases/enterprise-rag-engineering-v1/contracts/jsonschema/task.schema.json'
  /api/v1/evaluations/retrieval:
    post:
      operationId: run_retrieval_evaluation
      responses:
        '200':
          description: Baseline evaluation report
          content:
            application/json:
              schema:
                type: object
