version: 3.0.0
execution_model: single_backend_logical_modules
runtime_envelope_fields:
- agent_run_id
- session_id
- decision_cycle_id
- correlation_id
- causation_id
- requested_at
- schema_version
interfaces:
  diagnosis_agent:
    owner: 杨欣怡
    design_owner: 杨欣怡
    function_name: run_diagnosis
    input: diagnosis_input.schema.json
    output: diagnosis_output.schema.json
    timeout_seconds: 45
    max_retries: 2
    input_schema: contracts/jsonschema/agents/diagnosis_input.schema.json
    output_schema: contracts/jsonschema/agents/diagnosis_output.schema.json
