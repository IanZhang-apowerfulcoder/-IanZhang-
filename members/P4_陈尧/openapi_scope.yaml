components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KnowledgeBaseId:
      name: knowledge_base_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BuildRunId:
      name: build_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearnerId:
      name: learner_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    KnowledgeBaseVersionId:
      name: knowledge_base_version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrainingProgramId:
      name: training_program_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DecisionCycleId:
      name: decision_cycle_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceId:
      name: resource_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HumanReviewTaskId:
      name: human_review_task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentRunId:
      name: agent_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvidenceId:
      name: evidence_id
      in: path
      required: true
      schema:
        type: string
    PageNo:
      name: page_no
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AfterSequenceNo:
      name: after_sequence_no
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    ResponseMeta:
      type: object
      required:
      - request_id
      - schema_version
      - timestamp
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          const: 1.0.0
        timestamp:
          type: string
          format: date-time
    ErrorDetail:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type:
          - string
          - 'null'
    HealthView:
      type: object
      required:
      - status
      - version
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        version:
          type: string
    KnowledgeBaseView:
      type: object
      required:
      - knowledge_base_id
      - name
      - status
      - document_count
      - created_at
      - updated_at
      properties:
        knowledge_base_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - draft
          - building
          - ready
          - failed
          - archived
        document_count:
          type: integer
          description: 文档数
          minimum: 0
        active_version:
          type:
          - integer
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          description: 更新时间
          format: date-time
        active_version_id:
          type:
          - string
          - 'null'
          description: 当前激活版本
          format: uuid
        active_version_no:
          type:
          - integer
          - 'null'
          description: 当前激活版本号
          minimum: 1
    CreateKnowledgeBaseRequest:
      type: object
      required:
      - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type:
          - string
          - 'null'
          maxLength: 1000
    DocumentView:
      type: object
      required:
      - document_id
      - knowledge_base_id
      - file_name
      - status
      - created_at
      properties:
        document_id:
          type: string
          format: uuid
        knowledge_base_id:
          type: string
          format: uuid
        file_name:
          type: string
        file_size_bytes:
          type: integer
          minimum: 0
        mime_type:
          type: string
        status:
          type: string
          enum:
          - uploaded
          - queued
          - parsing
          - indexed
          - failed
          - deleted
        error_code:
          type:
          - string
          - 'null'
        error_message:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        original_file_name:
          type: string
        stored_file_name:
          type: string
        file_extension:
          type: string
        content_sha256:
          type: string
        document_status:
          type: string
          enum:
          - uploaded
          - parsing
          - parsed
          - parse_failed
          - indexed
          - archived
        parse_error_code:
          type:
          - string
          - 'null'
    CreateBuildRunRequest:
      type: object
      required:
      - document_ids
      additionalProperties: false
      properties:
        document_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        strategy_mode:
          type: string
          enum:
          - auto
          - hybrid_rag
          - vector_rag
          - graph_rag
          default: auto
    BuildRunView:
      type: object
      required:
      - build_run_id
      - knowledge_base_id
      - status
      - progress_percent
      - current_stage
      - created_at
      properties:
        build_run_id:
          type: string
          format: uuid
        knowledge_base_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        current_stage:
          type: string
          enum:
          - queued
          - analyzing
          - parsing
          - chunking
          - indexing
          - evaluating
          - publishing
          - completed
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        selected_strategy:
          type:
          - string
          - 'null'
          enum:
          - hybrid_rag
          - vector_rag
          - graph_rag
          - null
        error_code:
          type:
          - string
          - 'null'
        error_message:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        requested_document_ids:
          type: array
          items:
            type: string
            format: uuid
        build_mode:
          type: string
          enum:
          - full
          - incremental
        build_status:
          type: string
          enum:
          - queued
          - analyzing
          - parsing
          - chunking
          - extracting_entities
          - indexing
          - evaluating
          - succeeded
          - failed
          - cancelled
        current_stage_code:
          type: string
        target_version_id:
          type:
          - string
          - 'null'
          format: uuid
        requested_by_user_id:
          type: string
          format: uuid
        started_at:
          type:
          - string
          - 'null'
          format: date-time
    QualityMetric:
      type: object
      required:
      - metric_name
      - metric_value
      - threshold
      - passed
      properties:
        metric_name:
          type: string
        metric_value:
          type: number
        threshold:
