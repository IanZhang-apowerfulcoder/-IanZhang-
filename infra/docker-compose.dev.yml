services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: challenge_cup
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  knowledge-api:
    build: ../knowledge-bases/enterprise-rag-engineering-v2
    command: uvicorn server.app:app --host 0.0.0.0 --port 8090
    ports: ["8090:8090"]
    volumes:
      - ../knowledge-bases/enterprise-rag-engineering-v2:/app
volumes:
  pgdata: {}
