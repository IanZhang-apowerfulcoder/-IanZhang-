  /api/v1/review-queue:
    get:
      operationId: kb_get_review_queue
      summary: 待团队复核知识队列
      tags:
      - Knowledge Governance
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: pending_team_review
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      responses: *id001
components:
  schemas:
    GenericResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data: {}
        request_id:
          type: string
    ApiError:
      type: object
      required:
      - error_code
      - message
      - request_id
      properties:
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
