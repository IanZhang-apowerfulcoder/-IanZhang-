stage_tasks:
  S0:
    items:
    - 冻结知识内容状态、版本、导入格式、检索策略接口和 Evidence Bundle
    deliverables:
    - 知识维护规范
    - Retrieval Contract
    acceptance:
    - 知识库与业务库边界明确
    - 所有策略输出统一 Evidence Item
    dependencies:
    - P1
    - P2
  S1:
    items:
    - 提供 93 节点/372 切片 Mock 查询
    - 提供四策略 Mock 结果和融合样例
    deliverables:
    - Knowledge Mock
    - Retrieval Mock
    acceptance:
    - 每种策略至少 5 个样例
    - Mock 引用存在
    dependencies:
    - P6
  S2:
    items:
    - 完成 Domain Pack v2 整合
    - 实现结构化导入、Hybrid、Metadata、Graph-Assisted、Parent-Child 和 Evidence Fusion
    - 运行固定评测
    deliverables:
    - Knowledge Service v2
    - 检索报告
    acceptance:
    - Recall@5 >=0.90
    - MRR >=0.80
    - 所有证据可追溯
    - 两份知识包均默认可检索
    dependencies:
    - P6
    - P9
  S3:
    items:
    - 为 Router 暴露策略执行工具
    - 实现充分性特征和 fallback 数据
    - 支持并行安全执行
    deliverables:
    - Retrieval Tools
    - Fusion/Sufficiency
    acceptance:
    - 策略结果可重复
    - 去重正确
    - 融合后证据覆盖不低于单路基线
    dependencies:
    - P2
  S4:
    items:
    - 为各业务 Agent 提供受控 Evidence Bundle
    - 支持难度/节点/资源类型过滤
    deliverables:
    - Business Retrieval Profiles
    acceptance:
    - 不同 Agent 不越权
    - 资源生成引用覆盖 100%
    dependencies:
    - P3
    - P8
  S5:
    items:
    - 配合事实审核，提供 claim-evidence 对齐工具
    - 实现知识不足和冲突标记
    deliverables:
    - Evidence Verification Tool
    acceptance:
    - 无证据 claim 可识别
    - 冲突证据不被静默合并
    dependencies:
    - P9
  S6:
    items:
    - 扩充评测集、做策略消融和知识回归
    - 优化索引
    deliverables:
    - RAG Eval Report
    acceptance:
    - 多策略组合质量优于或不劣于单路
    - 检索 P95 达标
    - 回归失败可定位
    dependencies:
    - P9
  S7:
    items:
    - 冻结 Domain Pack v2 提交切片、来源清单和维护说明
    deliverables:
    - Knowledge Release
    acceptance:
    - 提交切片可独立验证
    - 版本和哈希完整
    dependencies:
    - P1
    - P9
