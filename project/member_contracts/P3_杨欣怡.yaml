version: 7.0.0
member_code: P3
member: 杨欣怡
role: 诊断、学习路径、测评评价与学习者画像
owns:
- Diagnosis Agent
- Path Planning Agent
- Assessment/Evaluation Agent
- 知识点掌握度模型
- 画像更新建议
- 难度适配规则
- 开放题评价与证据
not_owns:
- 最终仲裁
- 知识库检索策略选择
- 资源页面
- 数据库权威写入
source_docs:
- docs/07_七核心智能体与平行Agent职责.md
- docs/09_数据流与调用链.md
- docs/13_数据库与持久化约束.md
- docs/14_测试与验收标准.md
- docs/36_平行Agent生产与审核架构.md
contracts:
- contracts/jsonschema/agents/diagnosis_input.schema.json
- contracts/jsonschema/agents/diagnosis_output.schema.json
- contracts/jsonschema/agents/path_plan_input.schema.json
- contracts/jsonschema/agents/path_plan_output.schema.json
- contracts/jsonschema/agents/assessment_input.schema.json
- contracts/jsonschema/agents/assessment_output.schema.json
- contracts/jsonschema/agents/difficulty_review_output.schema.json
reviewers:
- P1
- P5
- P9
stage_tasks:
  S0:
    items:
    - 冻结 Diagnosis/Path/Assessment 输入输出
    - 定义画像更新、难度适配和证据规则
    deliverables:
    - Agent 契约
    - 画像模型说明
    acceptance:
    - 每项画像变化有 evidence_ref
    - Assessment 不直接写画像
    - Path 不绕过诊断
    dependencies:
    - P1
  S1:
    items:
    - 提供诊断/路径/测评 Mock
    - 提供三类学习者固定样例
    deliverables:
    - Mock 产物
    - 样例数据
    acceptance:
    - 3 类画像均覆盖正常/冲突/低置信度
    - Mock 通过 Schema
    dependencies:
    - P5
  S2:
    items:
    - 将 93 个知识节点映射到能力维度和前置关系
    - 定义前测蓝图
    deliverables:
    - 能力映射表
    - 前测蓝图
    acceptance:
    - 核心节点覆盖率 >=90%
    - 每道前测题可追溯知识节点
    dependencies:
    - P7
  S3:
    items:
    - 为 Router 提供目标知识节点、难度和任务类型上下文
    - 验证策略对学习者约束的使用
    deliverables:
    - Router Context Adapter
    - 联合测试
    acceptance:
    - 低水平用户不会检索超纲资源
    - 上下文缺失有明确降级
    dependencies:
    - P2
    - P7
  S4:
    items:
    - 实现 Diagnosis、Path Planning、Assessment/Evaluation Agent
    - 实现规则+LLM 双轨诊断
    deliverables:
    - 三个真实 Agent
    - 固定评测报告
    acceptance:
    - Schema 通过率 >=99%
    - 诊断人工一致率 >=85%
    - 难度适配初始准确率 >=85%
    dependencies:
    - P8
    - P9
  S5:
    items:
    - 提供 Difficulty Reviewer 规则基线
    - 实现画像更新建议和冲突检测
    deliverables:
    - 画像更新模块
    - 难度审核基线
    acceptance:
    - 画像更新可回滚
    - 矛盾结果触发重新诊断
    - 不直接覆盖历史快照
    dependencies:
    - P2
    - P6
    - P9
  S6:
    items:
    - 进行多画像回归和漂移测试
    - 优化开放题评价
    deliverables:
    - 学习者模型报告
    acceptance:
    - 三类画像结果可解释
    - 同一固定输入波动在阈值内
    - 开放题评分与人工一致率 >=85%
    dependencies:
    - P9
  S7:
    items:
    - 冻结样例画像和演示回答
    - 准备个性化闭环答辩
    deliverables:
    - 演示数据包
    - 技术说明
    acceptance:
    - 样例输入输出与实际系统一致
    dependencies:
    - P1
