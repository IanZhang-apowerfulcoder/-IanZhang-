version: 7.0.0
member_code: P9
member: 斯汀
role: 平行审核 Agent、独立 Evals、质量门禁、发布与比赛材料
owns:
- Factuality Reviewer
- Difficulty Reviewer
- Assessment Quality Reviewer
- Safety Reviewer
- Review Coordinator
- Agent/RAG/E2E 自动评测
- 消融实验
- 缺陷管理
- 发布门禁
- 演示与提交材料
not_owns:
- 单独批准自己实现的审核 Agent
- 修改业务状态机
- 未经脚本复现就写指标
source_docs:
- docs/14_测试与验收标准.md
- docs/16_任务卡与PR规则.md
- docs/18_演示与评测指标.md
- docs/20_开发启动清单.md
- docs/36_平行Agent生产与审核架构.md
- docs/40_比赛提交映射与最终交付清单.md
contracts:
- contracts/jsonschema/agents/factuality_review_output.schema.json
- contracts/jsonschema/agents/difficulty_review_output.schema.json
- contracts/jsonschema/agents/assessment_review_output.schema.json
- contracts/jsonschema/agents/safety_review_output.schema.json
- contracts/jsonschema/agents/review_output.schema.json
- reports/validation_report.md
reviewers:
- P1
- P2
- P3
- P7
stage_tasks:
  S0:
    items:
    - 冻结四类审核 Agent、评测集、指标和发布门禁
    - 定义独立验收关系
    deliverables:
    - Review Schemas
    - Eval Plan
    acceptance:
    - 审核维度互斥且覆盖完整
    - 任何指标有计算公式和数据集
    dependencies:
    - P1
    - P3
    - P7
  S1:
    items:
    - 验证所有契约/Mock
    - 建立 CI 和缺陷分级
    deliverables:
    - CI Baseline
    - Mock QA
    acceptance:
    - YAML/JSON/OpenAPI 100% 可解析
    - 72 张任务卡齐全
    - P0/P1=0
    dependencies:
    - ALL
  S2:
    items:
    - 审核知识库合并质量
    - 建立检索路由和 RAG 评测集
    deliverables:
    - KB/RAG Audit
    acceptance:
    - 引用完整
    - 重复/断链为 0
    - Recall@5 达门禁
    dependencies:
    - P7
  S3:
    items:
    - 建立路由标注集、循环/预算/fallback 测试
    - 实现 Router 独立评测
    deliverables:
    - Router Eval
    acceptance:
    - 路由准确率 >=90%
    - 无效循环率 <=2%
    - 预算违规为 0
    dependencies:
    - P2
  S4:
    items:
    - 实现 Factuality/Difficulty/Assessment/Safety 四个 Reviewer 和 Review Coordinator
    - 建立生成质量评测
    deliverables:
    - Review Agents v1
    - Agent Eval
    acceptance:
    - 事实审核 precision/recall 达门禁
    - 难度适配 >=85%
    - 答案错误不通过
    dependencies:
    - P3
    - P7
    - P8
  S5:
    items:
    - 完成冲突、修订、人工介入和仲裁全量测试
    deliverables:
    - Full-loop QA
    acceptance:
    - 至少 8 类冲突
    - 事实错误率 <=5%
    - 审后幻觉率目标达成
    dependencies:
    - P2
    - P5
  S6:
    items:
    - 执行 E2E、性能、安全、故障注入和消融实验
    - 生成指标看板数据
    deliverables:
    - Release Candidate Report
    acceptance:
    - 高优先级缺陷 0
    - 三类画像 x3 连跑
    - 所有指标脚本可重跑
    dependencies:
    - ALL
  S7:
    items:
    - 最终发布验收、视频/PPT/测试数据/部署说明一致性检查
    deliverables:
    - Final QA Sign-off
    - Submission Package
    acceptance:
    - 清单 100%
    - 哈希完整
    - 离线回放可用
    dependencies:
    - P1
