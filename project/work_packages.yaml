version: 7.0.0
stages:
- stage: S0
  name: 范围、架构与契约冻结
  goal: 冻结产品主线、七核心 Agent、平行 Agent、RAG 策略、接口、字段、数据库实体和验收口径。
- stage: S1
  name: GitHub 骨架与全 Mock 闭环
  goal: 所有前端和后端不依赖真实模型，用 Mock 跑通预建知识库、路由、并行生成、并行审核和仲裁。
- stage: S2
  name: 知识库 v2 与检索执行器
  goal: 完成两份知识库统一接入、持续维护工具、Hybrid/Metadata/Graph-Assisted/Parent-Child 基线和检索评测。
- stage: S3
  name: RAG Router 与 Agentic Retrieval
  goal: 实现问题分类、检索计划、有限并行、证据融合、充分性判断、补检索、预算和 Trace。
- stage: S4
  name: 诊断、路径、平行生成与测评
  goal: 实现学习者模型、诊断、路径、三类平行资源生成、资源编排和测评 Agent。
- stage: S5
  name: 平行审核、仲裁与完整闭环
  goal: 实现四类平行审核、审核汇总、定向修复、唯一仲裁、画像更新和动态学习路径。
- stage: S6
  name: 全站体验、可观测性与高强度验证
  goal: 完成所有页面、事件流、回放、消融实验、性能、安全、故障注入和三类画像实测。
- stage: S7
  name: 发布、演示与比赛提交
  goal: 冻结版本，完成部署、源码、测试数据、PPT、视频、说明书和可复现指标包。
