version: 7.0.0
boundaries:
- from: apps/web
  to: apps/api
  contract: api/openapi.yaml
- from: apps/api
  to: services/agent_runtime
  contract: api/internal_openapi.yaml
- from: services/agent_runtime
  to: agents
  contract: api/internal_agent_interfaces.yaml + contracts/jsonschema/agents
- from: rag_router
  to: services/retrieval
  contract: contracts/jsonschema/services/retrieval_plan.schema.json
- from: services/retrieval
  to: generation_review
  contract: contracts/jsonschema/services/evidence_bundle.schema.json
- from: apps/api
  to: database
  contract: database/schema.sql
- from: apps/api
  to: apps/web
  contract: stable public view models + workflow events
