version: 1.0.0
flows:
- workflow_name: 管理员创建并发布知识库
  steps:
  - sequence_no: 1
    operation_id: login
    output_ids:
      organization_id: 11111111-1111-4111-8111-111111111111
      user_id: 22222222-2222-4222-8222-222222222222
  - sequence_no: 2
    operation_id: create_knowledge_base
    output_ids:
      knowledge_base_id: 44444444-4444-4444-8444-444444444444
  - sequence_no: 3
    operation_id: upload_document
    output_ids:
      document_id: 55555555-5555-4555-8555-555555555555
  - sequence_no: 4
    operation_id: create_build_run
    output_ids:
      build_run_id: 66666666-6666-4666-8666-666666666666
  - sequence_no: 5
    operation_id: get_build_run
    output_ids:
      knowledge_base_version_id: 77777777-7777-4777-8777-777777777777
      quality_report_id: 88888888-8888-4888-8888-888888888888
  - sequence_no: 6
    operation_id: get_quality_report
    output_ids:
      quality_report_id: 88888888-8888-4888-8888-888888888888
  - sequence_no: 7
    operation_id: run_retrieval_test
    output_ids:
      retrieval_test_run_id: 99999999-9999-4999-8999-999999999999
  - sequence_no: 8
    operation_id: publish_knowledge_base_version
    output_ids:
      knowledge_base_version_id: 77777777-7777-4777-8777-777777777777
      version_status: published
      published_at: '2026-07-30T12:00:00Z'
  - sequence_no: 9
    operation_id: activate_knowledge_base_version
    output_ids:
      knowledge_base_version_id: 77777777-7777-4777-8777-777777777777
      version_status: active
- workflow_name: 管理员创建培训项目并分配学习者
  steps:
  - sequence_no: 1
    operation_id: create_training_program
    output_ids:
      training_program_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
      program_status: draft
  - sequence_no: 2
    operation_id: publish_training_program
    output_ids:
      training_program_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
      program_status: published
      published_at: '2026-07-30T12:00:00Z'
  - sequence_no: 3
    operation_id: create_assignments
    output_ids:
      assignment_id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
      learner_id: 33333333-3333-4333-8333-333333333333
      assignment_status: assigned
- workflow_name: 学习者完成一次联合决策学习闭环
  steps:
  - sequence_no: 1
    operation_id: list_learner_assignments
    output_ids:
      assignment_id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
  - sequence_no: 2
    operation_id: start_learning_session
    output_ids:
      session_id: cccccccc-cccc-4ccc-8ccc-cccccccccccc
      profile_snapshot_id: fc111111-1111-4111-8111-111111111111
      knowledge_base_version_id: 77777777-7777-4777-8777-777777777777
  - sequence_no: 3
    internal_interface: diagnosis_agent
    output_ids:
      proposal_id: f2111111-1111-4111-8111-111111111111
  - sequence_no: 4
    internal_interface: path_planning_agent
    output_ids:
      proposal_id: f3111111-1111-4111-8111-111111111111
      path_step_id: fe611111-1111-4111-8111-111111111111
  - sequence_no: 5
    internal_interface: resource_generation_agent
    output_ids:
      proposal_id: f1111111-1111-4111-8111-111111111111
      resource_draft_id: f7121111-1111-4111-8111-111111111111
  - sequence_no: 6
    internal_interface: review_agent
    output_ids:
      review_id: f4111111-1111-4111-8111-111111111111
      review_result: approved
  - sequence_no: 7
    internal_interface: arbitration_agent
    output_ids:
      proposal_id: f1511111-1111-4111-8111-111111111111
      decision_type: deliver_resource
  - sequence_no: 8
    operation_id: get_current_action
    output_ids:
      resource_id: f7111111-1111-4111-8111-111111111111
      action_status: available
  - sequence_no: 9
    operation_id: update_resource_progress
    output_ids:
      resource_id: f7111111-1111-4111-8111-111111111111
      progress_status: completed
      progress_percent: 100
      updated_at: '2026-07-30T12:00:00Z'
  - sequence_no: 10
    operation_id: get_learner_profile
    output_ids:
      profile_snapshot_id: fc211111-1111-4111-8111-111111111111
      profile_version_no: 2
